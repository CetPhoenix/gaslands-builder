<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo Alpha - Gaslands Refuelled</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --card-bg: #2a2a2a;
      --accent-color: #ff5500;
      --accent-hover: #e04b00;
      --text-color: #f0f0f0;
      --text-muted: #aaa;
      --border-color: #333;
      --danger-color: #cc2929;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; color: var(--accent-color); font-size: 1.8rem; }

    /* Layout principal en 2 columnas */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr 450px;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Panel del Builder */
    .summary-bar {
      background: var(--panel-bg);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .vehicle-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .vehicle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    select, input {
      width: 100%;
      padding: 8px;
      background: #2b2b2b;
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover { background: var(--accent-hover); }
    button.btn-danger { background: var(--danger-color); }
    button.btn-danger:hover { background: #a81e1e; }

    /* Panel Lateral: Catálogo */
    .catalog-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      height: fit-content;
      max-height: 85vh;
      overflow-y: auto;
    }

    .catalog-panel h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    /* Pestañas Plegables (Details) */
    details {
      background: #242424;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 10px;
      padding: 8px 12px;
    }

    summary {
      font-weight: bold;
      color: #ff9900;
      cursor: pointer;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      outline: none;
    }

    summary:hover {
      color: var(--accent-color);
    }

    .catalog-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .catalog-item-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #fff;
      margin-bottom: 6px;
    }

    .catalog-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .catalog-stats span {
      background: #1a1a1a;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .catalog-rules {
      color: #7dcfb6;
      font-style: italic;
      font-size: 0.8rem;
    }

    .total-display {
      font-weight: bold;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Nexo Alpha - Gaslands Refuelled</h1>
</header>

<div class="main-layout">
  <!-- COLUMNA IZQUIERDA: CREADOR DE ESCUDERÍA -->
  <div class="builder-column">
    <div class="summary-bar">
      <div>
        <label>Escudería: </label>
        <input type="text" id="teamName" placeholder="Nombre de tu banda" style="width: 150px;">
      </div>
      <div>
        <label>Patrocinador: </label>
        <select id="sponsorSelect" style="width: 140px;">
          <option value="Ninguno">Sin Patrocinador</option>
          <option value="Rutherford">Rutherford</option>
          <option value="Mishkin">Mishkin</option>
          <option value="Slime">Slime</option>
          <option value="Scarlett">Scarlett</option>
          <option value="La Alcaidesa">La Alcaidesa</option>
          <option value="Verney">Verney</option>
          <option value="Miyazaki">Miyazaki</option>
          <option value="Idris">Idris</option>
          <option value="Bootlegger">Bootlegger</option>
          <option value="Order of the Inferno">Order of the Inferno</option>
          <option value="Beverly">Beverly</option>
          <option value="Rusty's Boot Polish">Rusty's Boot Polish</option>
        </select>
      </div>
      <div>
        <label>Formato: </label>
        <select id="maxCansSelect" onchange="renderBuilder()" style="width: 100px;">
          <option value="25">25 Bid.</option>
          <option value="50" selected>50 Bid.</option>
          <option value="100">100 Bid.</option>
        </select>
      </div>
      <div class="total-display">
        Total: <span id="totalBidones">0</span> / <span id="maxBidonesDisplay">50</span> Bid.
      </div>
    </div>

    <div id="vehiclesList"></div>

    <button onclick="addVehicle()">+ Añadir Vehículo</button>
  </div>

  <!-- COLUMNA DERECHA: CATÁLOGOS CON ETIQUETAS PLEGABLES -->
  <div class="catalog-panel">
    <h2>Catálogo de Referencia</h2>

    <!-- Plegable: Vehículos Básicos -->
    <details open>
      <summary>Vehículos Básicos</summary>
      <div id="catalogVehiclesBasic"></div>
    </details>

    <!-- Plegable: Vehículos Avanzados -->
    <details open>
      <summary>Vehículos Avanzados</summary>
      <div id="catalogVehiclesAdvanced"></div>
    </details>

    <!-- Plegable: Armamento Básico -->
    <details open>
      <summary>Armamento Básico</summary>
      <div id="catalogWeaponsBasic"></div>
    </details>

    <!-- Plegable: Armamento Avanzado -->
    <details>
      <summary>Armamento Avanzado</summary>
      <div id="catalogWeaponsAdvanced"></div>
    </details>

    <!-- Plegable: Armamento Avanzado (Personales) -->
    <details>
      <summary>Armamento Avanzado (Personales)</summary>
      <div id="catalogWeaponsPersonal"></div>
    </details>
  </div>
</div>

<script>
  // BASE DE DATOS DE VEHÍCULOS
  const VEHICLES = [
    // BÁSICOS
    { name: "Buggy", category: "Básico", weight: "Ligero", bidones: 6, slots: 2, hull: 6, gear: 6, handling: 4, crew: 2, rules: "Jaula de seguridad" },
    { name: "Camioneta", category: "Básico", weight: "Medio", bidones: 15, slots: 3, hull: 12, gear: 4, handling: 2, crew: 3, rules: "-" },
    { name: "Coche", category: "Básico", weight: "Medio", bidones: 12, slots: 2, hull: 10, gear: 5, handling: 3, crew: 2, rules: "-" },
    { name: "Coche de alto rendimiento", category: "Básico", weight: "Medio", bidones: 15, slots: 2, hull: 8, gear: 6, handling: 4, crew: 1, rules: "Esfumarse" },
    { name: "Autobús", category: "Básico", weight: "Pesado", bidones: 30, slots: 3, hull: 16, gear: 3, handling: 2, crew: 8, rules: "-" },
    { name: "Camión", category: "Básico", weight: "Pesado", bidones: 25, slots: 5, hull: 14, gear: 3, handling: 2, crew: 4, rules: "-" },

    // AVANZADOS
    { name: "Moto", category: "Avanzado", weight: "Ligero", bidones: 5, slots: 1, hull: 4, gear: 6, handling: 5, crew: 1, rules: "Pisar a fondo, pivotar" },
    { name: "Moto con sidecar", category: "Avanzado", weight: "Ligero", bidones: 8, slots: 2, hull: 4, gear: 6, handling: 5, crew: 2, rules: "Pisar a fondo, pivotar" },
    { name: "Vaina de aceleración", category: "Avanzado", weight: "Ligero", bidones: 5, slots: 2, hull: 4, gear: 6, handling: 4, crew: 1, rules: "Motor a reacción" },
    { name: "Ambulancia", category: "Avanzado", weight: "Medio", bidones: 20, slots: 3, hull: 12, gear: 5, handling: 2, crew: 3, rules: "Depresivos, estimulantes" },
    { name: "Camión de los helados", category: "Avanzado", weight: "Medio", bidones: 8, slots: 2, hull: 10, gear: 4, handling: 2, crew: 2, rules: "Musiquilla irritante" },
    { name: "Girocóptero", category: "Avanzado", weight: "Medio", bidones: 10, slots: 0, hull: 4, gear: 6, handling: 4, crew: 1, rules: "As del aire, bombas fuera, volar, restringido" },
    { name: "Camión de guerra", category: "Avanzado", weight: "Pesado", bidones: 40, slots: 5, hull: 26, gear: 4, handling: 2, crew: 5, rules: "Consulta reglas de camión de guerra" },
    { name: "Helicóptero", category: "Avanzado", weight: "Pesado", bidones: 30, slots: 4, hull: 8, gear: 4, handling: 3, crew: 3, rules: "As del aire, bombas fuera, volar, restringido" },
    { name: "Monster truck", category: "Avanzado", weight: "Pesado", bidones: 25, slots: 2, hull: 10, gear: 4, handling: 3, crew: 2, rules: "Pasar por encima, todoterreno" },
    { name: "Tanque", category: "Avanzado", weight: "Pesado", bidones: 40, slots: 4, hull: 20, gear: 3, handling: 4, crew: 3, rules: "Pasar por encima, pivotar, todoterreno, torreta, restringido" }
  ];

  // BASE DE DATOS FIEL DE ARMAMENTO
  const WEAPONS = [
    { name: "Ninguna", category: "Básico", range: "-", attack: "-", rules: "-", slots: 0, bidones: 0 },
    
    // ARMAMENTO BÁSICO
    { name: "Ametralladora", category: "Básico", range: "Doble", attack: "2d6", rules: "-", slots: 1, bidones: 2 },
    { name: "Ametralladora pesada", category: "Básico", range: "Doble", attack: "3d6", rules: "-", slots: 1, bidones: 3 },
    { name: "Arma corta", category: "Básico", range: "Medio", attack: "1d6", rules: "Personal", slots: 0, bidones: 0 },
    { name: "Minigun", category: "Básico", range: "Doble", attack: "4d6", rules: "-", slots: 1, bidones: 5 },

    // ARMAMENTO AVANZADO
    { name: "AJG", category: "Avanzado", range: "Doble", attack: "10d6", rules: "Munición 1", slots: 3, bidones: 1 },
    { name: "Arpón", category: "Avanzado", range: "Doble", attack: "(5d6)", rules: "-", slots: 1, bidones: 2 },
    { name: "Batería de amplificadores", category: "Avanzado", range: "Medio", attack: "-", rules: "Arco de fuego de 360º", slots: 3, bidones: 4 },
    { name: "Bazuca", category: "Avanzado", range: "Doble", attack: "3d6", rules: "Munición 3, Onda expansiva", slots: 2, bidones: 4 },
    { name: "Bloqueador magnético", category: "Avanzado", range: "Doble", attack: "-", rules: "Eléctrico", slots: 0, bidones: 2 },
    { name: "Bola de demolición", category: "Avanzado", range: "Corto", attack: "-", rules: "-", slots: 3, bidones: 2 },
    { name: "Brazo articulado con pinza", category: "Avanzado", range: "Corto", attack: "3d6", rules: "-", slots: 1, bidones: 6 },
    { name: "Cañón de 125mm", category: "Avanzado", range: "Doble", attack: "8d6", rules: "Munición 3, Onda expansiva", slots: 3, bidones: 6 },
    { name: "Cañón gravitatorio", category: "Avanzado", range: "Doble", attack: "(3d6)", rules: "Eléctrico, Munición 1", slots: 1, bidones: 2 },
    { name: "Cohetes", category: "Avanzado", range: "Doble", attack: "6d6", rules: "Munición 3", slots: 2, bidones: 5 },
    { name: "Lanzachatarra", category: "Avanzado", range: "Doble/Descarga", attack: "-", rules: "Munición 3", slots: 4, bidones: 4 },
    { name: "Lanzallamas", category: "Avanzado", range: "Ráfaga larga", attack: "6d6", rules: "Indirecto, fuego, munición 3, salpicadura", slots: 2, bidones: 4 },
    { name: "Láser militar", category: "Avanzado", range: "Doble", attack: "3d6", rules: "Salpicadura", slots: 1, bidones: 5 },
    { name: "Martilleador", category: "Avanzado", range: "Medio", attack: "-", rules: "360 grados, eléctrico, indirecto, munición 1", slots: 2, bidones: 4 },
    { name: "Mortero", category: "Avanzado", range: "Doble", attack: "4d6", rules: "indirecto, munición 3", slots: 1, bidones: 4 },
    { name: "Multiplicador cinético", category: "Avanzado", range: "Doble", attack: "(6d6)", rules: "Eléctrico, munición 1", slots: 2, bidones: 6 },
    { name: "Proyector de arcos", category: "Avanzado", range: "Doble", attack: "6d6", rules: "Eléctrico, munición 1", slots: 2, bidones: 6 },
    { name: "Rayo de la muerte", category: "Avanzado", range: "Doble", attack: "3d6", rules: "Eléctrico, munición 1", slots: 1, bidones: 3 },

    // ARMAMENTO AVANZADO (PERSONALES)
    { name: "Cockteles molotov", category: "Personal", range: "Medio", attack: "1d6", rules: "Indirecto, fuego, munición 5, personal, salva", slots: 0, bidones: 1 },
    { name: "Escopeta", category: "Personal", range: "Largo", attack: "*", rules: "Personal", slots: 0, bidones: 4 },
    { name: "Granadas", category: "Personal", range: "Medio", attack: "1d6", rules: "Indirecto, munición 5, personal, salva", slots: 0, bidones: 1 },
    { name: "Granadas de gas", category: "Personal", range: "Medio", attack: "(1d6)", rules: "Indirecto, munición 5, personal, salva", slots: 0, bidones: 1 },
    { name: "Magnum", category: "Personal", range: "Doble", attack: "1d6", rules: "Onda expansiva, personal", slots: 0, bidones: 3 },
    { name: "Red de acero", category: "Personal", range: "Corto", attack: "(3d6)", rules: "Onda expansiva, personal", slots: 0, bidones: 2 },
    { name: "Subfusil", category: "Personal", range: "Medio", attack: "(3d6)", rules: "Personal", slots: 0, bidones: 5 },
    { name: "Trabuco", category: "Personal", range: "Ráfaga pequeña", attack: "2d6", rules: "Personal, salpicadura", slots: 0, bidones: 2 }
  ];

  let team = [];

  // RENDERIZAR LOS CATÁLOGOS EN SUS PESTAÑAS PLEGABLES
  function renderCatalog() {
    const vBasic = document.getElementById('catalogVehiclesBasic');
    const vAdv = document.getElementById('catalogVehiclesAdvanced');
    const wBasic = document.getElementById('catalogWeaponsBasic');
    const wAdv = document.getElementById('catalogWeaponsAdvanced');
    const wPersonal = document.getElementById('catalogWeaponsPersonal');

    vBasic.innerHTML = '';
    vAdv.innerHTML = '';
    wBasic.innerHTML = '';
    wAdv.innerHTML = '';
    wPersonal.innerHTML = '';

    // Render Vehículos
    VEHICLES.forEach(v => {
      const item = document.createElement('div');
      item.className = 'catalog-item';
      item.innerHTML = `
        <div class="catalog-item-header">
          <span>${v.name}</span>
          <span style="color: var(--accent-color);">${v.bidones} Bid.</span>
        </div>
        <div class="catalog-stats">
          <span><b>Peso:</b> ${v.weight}</span>
          <span><b>PC:</b> ${v.hull}</span>
          <span><b>Marcha:</b> ${v.gear}</span>
          <span><b>Maniob.:</b> ${v.handling}</span>
          <span><b>Trip.:</b> ${v.crew}</span>
          <span><b>Casillas:</b> ${v.slots}</span>
        </div>
        <div class="catalog-rules"><b>Especial:</b> ${v.rules}</div>
      `;
      if (v.category === "Básico") vBasic.appendChild(item);
      else vAdv.appendChild(item);
    });

    // Render Armas
    WEAPONS.filter(w => w.name !== "Ninguna").forEach(w => {
      const item = document.createElement('div');
      item.className = 'catalog-item';
      item.innerHTML = `
        <div class="catalog-item-header">
          <span>${w.name}</span>
          <span style="color: var(--accent-color);">${w.bidones} Bid.</span>
        </div>
        <div class="catalog-stats">
          <span><b>Alcance:</b> ${w.range}</span>
          <span><b>Ataque:</b> ${w.attack}</span>
          <span><b>Casillas:</b> ${w.slots}</span>
        </div>
        <div class="catalog-rules"><b>Especial:</b> ${w.rules}</div>
      `;
      if (w.category === "Básico") wBasic.appendChild(item);
      else if (w.category === "Avanzado") wAdv.appendChild(item);
      else if (w.category === "Personal") wPersonal.appendChild(item);
    });
  }

  function addVehicle() {
    const newVehicle = {
      id: Date.now(),
      name: "Nuevo Vehículo",
      type: "Coche",
      weapon1: "Ninguna",
      weapon2: "Ninguna"
    };
    team.push(newVehicle);
    renderBuilder();
  }

  function removeVehicle(id) {
    team = team.filter(v => v.id !== id);
    renderBuilder();
  }

  function updateVehicle(id, field, value) {
    const v = team.find(item => item.id === id);
    if (v) {
      v[field] = value;
      renderBuilder();
    }
  }

  function renderBuilder() {
    const container = document.getElementById('vehiclesList');
    container.innerHTML = '';
    let grandTotalBidones = 0;
    const maxCans = parseInt(document.getElementById('maxCansSelect').value);

    document.getElementById('maxBidonesDisplay').innerText = maxCans;

    team.forEach((v) => {
      const vData = VEHICLES.find(item => item.name === v.type) || VEHICLES[2];
      const w1Data = WEAPONS.find(w => w.name === v.weapon1) || WEAPONS[0];
      const w2Data = WEAPONS.find(w => w.name === v.weapon2) || WEAPONS[0];

      const usedSlots = w1Data.slots + w2Data.slots;
      const vehicleBidones = vData.bidones + w1Data.bidones + w2Data.bidones;
      grandTotalBidones += vehicleBidones;

      const card = document.createElement('div');
      card.className = 'vehicle-card';
      card.innerHTML = `
        <div class="vehicle-header">
          <input type="text" value="${v.name}" onchange="updateVehicle(${v.id}, 'name', this.value)" style="font-weight: bold; width: 55%;">
          <div>
            <strong>${vehicleBidones} Bid.</strong> | 
            <span style="color: ${usedSlots > vData.slots ? '#ff4444' : '#888'}">
              Slots: ${usedSlots}/${vData.slots}
            </span>
            <button class="btn-danger" style="margin-left: 10px;" onclick="removeVehicle(${v.id})">X</button>
          </div>
        </div>
        <div class="grid">
          <div>
            <label>Tipo de Vehículo:</label>
            <select onchange="updateVehicle(${v.id}, 'type', this.value)">
              ${VEHICLES.map(vItem => `<option value="${vItem.name}" ${vItem.name === v.type ? 'selected' : ''}>${vItem.name} (${vItem.bidones} Bid.)</option>`).join('')}
            </select>
          </div>
          <div>
            <label>Arma 1:</label>
            <select onchange="updateVehicle(${v.id}, 'weapon1', this.value)">
              ${WEAPONS.map(w => `<option value="${w.name}" ${w.name === v.weapon1 ? 'selected' : ''}>${w.name} (${w.bidones} Bid., ${w.slots} Slot)</option>`).join('')}
            </select>
          </div>
          <div>
            <label>Arma 2:</label>
            <select onchange="updateVehicle(${v.id}, 'weapon2', this.value)">
              ${WEAPONS.map(w => `<option value="${w.name}" ${w.name === v.weapon2 ? 'selected' : ''}>${w.name} (${w.bidones} Bid., ${w.slots} Slot)</option>`).join('')}
            </select>
          </div>
        </div>
        <div style="margin-top: 10px; font-size: 0.85em; color: var(--text-muted);">
          <b>Categoría:</b> ${vData.category} | <b>Peso:</b> ${vData.weight} | <b>PC:</b> ${vData.hull} | <b>Marcha Máx:</b> ${vData.gear} | <b>Maniobra:</b> ${vData.handling} | <b>Tripulación:</b> ${vData.crew}
        </div>
      `;
      container.appendChild(card);
    });

    const totalElement = document.getElementById('totalBidones');
    totalElement.innerText = grandTotalBidones;
    if (grandTotalBidones > maxCans) {
      totalElement.style.color = '#ff4444';
    } else {
      totalElement.style.color = '#fff';
    }
  }

  // Inicialización
  renderCatalog();
  addVehicle();
</script>
</body>
</html>

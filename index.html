<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo Alpha - Gaslands Refuelled</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --card-bg: #2a2a2a;
      --accent-color: #ff5500;
      --accent-hover: #e04b00;
      --text-color: #f0f0f0;
      --text-muted: #aaa;
      --text-disabled: #555555;
      --border-color: #333;
      --danger-color: #cc2929;

      /* Colores por Categoría de Vehículos */
      --cat-veh-basico: #2196F3;
      --cat-veh-avanzado: #9C27B0;

      /* Colores por Categoría de Armas/Mejoras */
      --cat-arm-basico: #4CAF50;
      --cat-arm-avanzado: #FF9800;
      --cat-arm-personal: #00BCD4;
      --cat-arm-descarga: #E91E63;
      --cat-mejora-veh: #FFD700;

      /* Colores por Categoría de Ventajas */
      --perk-agresivo: #e53935;
      --perk-aterrador: #8e24aa;
      --perk-intrepido: #fb8c00;
      --perk-macizo: #6d4c41;
      --perk-militar: #43a047;
      --perk-persecucion: #d81b60;
      --perk-preciso: #7cb342;
      --perk-rudo: #1e88e5;
      --perk-tecnologia: #00acc1;
      --perk-temerario: #546e7a;
      --perk-tuneo: #fdd835;
      --perk-velocidad: #3949ab;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; color: var(--accent-color); font-size: 1.8rem; }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 450px;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .main-layout { grid-template-columns: 1fr; }
    }

    .summary-bar {
      background: var(--panel-bg);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .vehicle-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      position: relative;
    }

    .vehicle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .vehicle-stats-box {
      background: #242424;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }

    .vehicle-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 6px;
      margin-bottom: 6px;
    }

    .vehicle-stats-grid span {
      background: #1a1a1a;
      padding: 4px 6px;
      border-radius: 3px;
      color: var(--text-muted);
    }

    .stat-modified-hull { color: #ff9800 !important; font-weight: bold; }
    .stat-modified-crew { color: #ff4444 !important; font-weight: bold; }

    .section-block {
      background: #181818;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .upgrade-row {
      background: #242424;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .upgrade-controls {
      display: grid;
      grid-template-columns: 1fr 130px 40px;
      gap: 8px;
      align-items: end;
    }

    .perk-controls {
      display: grid;
      grid-template-columns: 1fr 40px;
      gap: 8px;
      align-items: end;
    }

    @media (max-width: 600px) {
      .upgrade-controls, .perk-controls { grid-template-columns: 1fr; }
    }

    .weapon-details-badge {
      background: #1a1a1a;
      border: 1px dashed #444;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #7dcfb6;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    select, input {
      width: 100%;
      padding: 8px;
      background: #2b2b2b;
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
    }

    select:disabled, button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    optgroup.grp-v-basico { color: var(--cat-veh-basico); font-weight: bold; }
    optgroup.grp-v-avanzado { color: var(--cat-veh-avanzado); font-weight: bold; }

    optgroup.grp-a-basico { color: var(--cat-arm-basico); font-weight: bold; }
    optgroup.grp-a-avanzado { color: var(--cat-arm-avanzado); font-weight: bold; }
    optgroup.grp-a-personal { color: var(--cat-arm-personal); font-weight: bold; }
    optgroup.grp-a-descarga { color: var(--cat-arm-descarga); font-weight: bold; }
    optgroup.grp-m-vehiculo { color: var(--cat-mejora-veh); font-weight: bold; }

    /* Clases para Optgroups de Ventajas */
    optgroup.grp-pk-agresivo { color: var(--perk-agresivo); font-weight: bold; }
    optgroup.grp-pk-aterrador { color: var(--perk-aterrador); font-weight: bold; }
    optgroup.grp-pk-intrepido { color: var(--perk-intrepido); font-weight: bold; }
    optgroup.grp-pk-macizo { color: var(--perk-macizo); font-weight: bold; }
    optgroup.grp-pk-militar { color: var(--perk-militar); font-weight: bold; }
    optgroup.grp-pk-persecucion { color: var(--perk-persecucion); font-weight: bold; }
    optgroup.grp-pk-preciso { color: var(--perk-preciso); font-weight: bold; }
    optgroup.grp-pk-rudo { color: var(--perk-rudo); font-weight: bold; }
    optgroup.grp-pk-tecnologia { color: var(--perk-tecnologia); font-weight: bold; }
    optgroup.grp-pk-temerario { color: var(--perk-temerario); font-weight: bold; }
    optgroup.grp-pk-tuneo { color: var(--perk-tuneo); font-weight: bold; }
    optgroup.grp-pk-velocidad { color: var(--perk-velocidad); font-weight: bold; }
    
    option { color: #ffffff; font-weight: normal; background: #2b2b2b; }
    
    option:disabled {
      color: #666666 !important;
      background-color: #1a1a1a !important;
      font-style: italic;
    }

    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover { background: var(--accent-hover); }
    button.btn-danger { background: var(--danger-color); padding: 8px; }
    button.btn-danger:hover { background: #a81e1e; }
    button.btn-add { background: #2e7d32; font-size: 0.85rem; }
    button.btn-add:hover { background: #1b5e20; }
    button.btn-print { background: #008CBA; }
    button.btn-print:hover { background: #007399; }
    button.btn-new-squad { background: #7b1fa2; }
    button.btn-new-squad:hover { background: #6a1b9a; }

    .catalog-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      height: fit-content;
      max-height: 85vh;
      overflow-y: auto;
    }

    .catalog-panel h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    details {
      background: #242424;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 10px;
      padding: 8px 12px;
    }

    summary {
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      outline: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-tag {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }

    .catalog-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .catalog-item-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #fff;
      margin-bottom: 6px;
    }

    .catalog-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .catalog-stats span {
      background: #1a1a1a;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .catalog-rules {
      color: #7dcfb6;
      font-style: italic;
      font-size: 0.8rem;
    }

    .total-display {
      font-weight: bold;
      font-size: 1.05rem;
    }

    .fixed-weapon-badge {
      background: #1b382b;
      border: 1px solid #4CAF50;
      color: #81c784;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }

    .sponsor-badge { color: #FF9800; font-weight: bold; font-size: 0.8rem; }

    /* ESTILOS DEL MODAL DE FICHAS DE VEHÍCULOS */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: #333;
      color: #000;
      width: 95%;
      max-width: 1050px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 8px;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #555;
      padding-bottom: 10px;
      color: #fff;
    }

    .cards-preview-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    /* VISTA Y DISEÑO DE LA FICHA TIPO CARTA STANDARD (63mm x 88mm) */
    .card-ammo-box {
      width: 2.8mm;
      height: 2.8mm;
      border: 1px solid #000;
      display: inline-block;
      margin-left: 1px;
      vertical-align: middle;
      background: #fff;
      box-sizing: border-box;
    }
    .ammo-container {
      margin-top: 1px;
      font-size: 4.5pt;
      line-height: 1;
    }

    .printable-card {
      background: #fff;
      color: #000;
      border: 2px solid #000;
      width: 63mm;
      height: 88mm;
      padding: 2.5mm;
      box-sizing: border-box;
      font-size: 6.5pt;
      line-height: 1.1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      border-radius: 3mm;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      page-break-inside: avoid;
    }

    .card-top-bar {
      border-bottom: 1px solid #000;
      padding-bottom: 1px;
      margin-bottom: 2px;
      font-size: 5.5pt;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
    }

    .card-title-box {
      text-align: center;
      border-bottom: 1.5px solid #000;
      padding-bottom: 2px;
      margin-bottom: 3px;
      background: #f0f0f0;
      border-radius: 2px;
    }

    .card-title-box h2 {
      margin: 0;
      font-size: 8.5pt;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      line-height: 1;
    }

    .card-title-box .sub {
      font-size: 5.5pt;
      color: #333;
      font-weight: bold;
    }

    .card-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      margin-bottom: 3px;
    }

    .card-stat-box {
      border: 1px solid #000;
      text-align: center;
      padding: 1px 0;
      border-radius: 2px;
      background: #fafafa;
    }

    .card-stat-box .lbl {
      font-size: 4.5pt;
      font-weight: bold;
      text-transform: uppercase;
      border-bottom: 0.5px solid #888;
      padding-bottom: 1px;
      line-height: 1;
    }

    .card-stat-box .val {
      font-size: 7.5pt;
      font-weight: bold;
      line-height: 1.1;
    }

    .card-hull-section {
      border: 1px solid #000;
      padding: 2px 3px;
      margin-bottom: 3px;
      border-radius: 2px;
      background: #fff;
    }

    .card-hull-header {
      font-size: 5.5pt;
      font-weight: bold;
      margin-bottom: 1px;
      display: flex;
      justify-content: space-between;
    }

    .card-hull-boxes {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5px;
    }

    .card-hull-box {
      width: 3.5mm;
      height: 3.5mm;
      border: 1px solid #000;
      display: inline-block;
      box-sizing: border-box;
      background: #fff;
    }

    .card-section-title {
      font-size: 5.5pt;
      font-weight: bold;
      text-transform: uppercase;
      background: #000;
      color: #fff;
      padding: 1px 3px;
      margin-top: 1px;
      margin-bottom: 1px;
      border-radius: 1px;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2px;
    }

    .mini-table th, .mini-table td {
      border: 0.5px solid #000;
      padding: 1px 1.5px;
      text-align: center;
      font-size: 5pt;
    }

    .mini-table th {
      background: #ddd;
      font-weight: bold;
      text-transform: uppercase;
    }

    .mini-table td.left {
      text-align: left;
      font-weight: bold;
    }

    .card-footer {
      text-align: center;
      font-size: 4.5pt;
      font-style: italic;
      border-top: 0.5px solid #888;
      padding-top: 1px;
      margin-top: auto;
    }

    /* REGLAS CSS PARA IMPRESIÓN A4 Y DISTRIBUCIÓN DE FICHAS (63mm x 88mm) */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      body {
        background: #fff !important;
        color: #000 !important;
        padding: 0 !important;
      }
      header, .main-layout, .modal-header-actions {
        display: none !important;
      }
      .modal-overlay {
        position: static !important;
        display: block !important;
        width: 100% !important;
        height: auto !important;
        background: none !important;
      }
      .modal-content {
        max-width: 100% !important;
        width: 100% !important;
        padding: 0 !important;
        border: none !important;
        background: none !important;
      }
      .cards-preview-grid {
        display: grid !important;
        grid-template-columns: repeat(3, 63mm) !important;
        gap: 4mm 6mm !important;
        justify-content: start !important;
        transform: scale(1) !important;
      }
      .printable-card {
        box-shadow: none !important;
        border: 1.5px solid #000 !important;
        page-break-inside: avoid !important;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<header>
  <h1>Nexo Alpha - Gaslands Refuelled</h1>
</header>

<div class="main-layout">
  <div class="builder-column">
    <div class="summary-bar">
      <div>
        <button class="btn-new-squad" onclick="createNewSquadron()">✨ Nuevo Escuadrón</button>
      </div>
      <div>
        <label>Escudería: </label>
        <input type="text" id="teamName" placeholder="Nombre de tu banda" value="Mi Escudería" onchange="renderBuilder()" style="width: 130px;">
      </div>
      <div>
        <label>Patrocinador: </label>
        <select id="sponsorSelect" onchange="renderBuilder()" style="width: 200px;">
          <option value="Ninguno">Sin Patrocinador</option>
          <option value="La Alcaidesa">La Alcaidesa</option>
          <option value="Beverly, La Diablesa de la Autopista">Beverly, La Diablesa de la Autopista</option>
          <option value="Los Contrabandistas de Rusty">Los Contrabandistas de Rusty</option>
          <option value="Idris">Idris</option>
          <option value="Maxxine">Maxxine</option>
          <option value="Mishkin">Mishkin</option>
          <option value="Miyazaki">Miyazaki</option>
          <option value="La Orden Infernal">La Orden Infernal</option>
          <option value="La Patrulla de la Autopista">La Patrulla de la Autopista</option>
          <option value="Rutherford">Rutherford</option>
          <option value="Scarlett">Scarlett</option>
          <option value="Slime">Slime</option>
          <option value="Verney">Verney</option>
        </select>
        <div id="sponsorPerksDisplay" style="font-size: 0.8rem; color: #7dcfb6; margin-top: 4px;"><b>Ventajas:</b> Ninguna</div>
      </div>
      <div>
        <label>Formato: </label>
        <input type="number" id="maxCansSelect" value="50" min="1" oninput="renderBuilder()" style="width: 65px;">
      </div>
      <div class="total-display">
        Total: <span id="totalBidones">0</span> / <span id="maxBidonesDisplay">50</span> Bid.
      </div>
      <div>
        <button class="btn-print" onclick="openCardsModal()">📋 Generar Fichas</button>
      </div>
    </div>

    <div id="vehiclesList"></div>

    <button onclick="addVehicle()">+ Añadir Vehículo</button>
  </div>

  <div class="catalog-panel">
    <h2>Catálogo de Referencia</h2>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-veh-basico);"></span> Vehículos Básicos</summary>
      <div id="catalogVehiclesBasic"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-veh-avanzado);"></span> Vehículos Avanzados</summary>
      <div id="catalogVehiclesAdvanced"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-arm-basico);"></span> Armamento Básico</summary>
      <div id="catalogWeaponsBasic"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-arm-avanzado);"></span> Armamento Avanzado</summary>
      <div id="catalogWeaponsAdvanced"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-arm-personal);"></span> Armamento Avanzado (Personales)</summary>
      <div id="catalogWeaponsPersonal"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-arm-descarga);"></span> Armamento Avanzado (Descarga)</summary>
      <div id="catalogWeaponsDropped"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-mejora-veh);"></span> Mejoras para Vehículo</summary>
      <div id="catalogVehicleUpgrades"></div>
    </details>
  </div>
</div>

<!-- MODAL PARA VISTA PREVIA E IMPRESIÓN DE FICHAS -->
<div id="cardsModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header-actions">
      <h3 style="margin: 0; color: #fff;">Fichas de Vehículos (63mm x 88mm)</h3>
      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <span style="font-size: 0.85rem;">Zoom:</span>
        <button onclick="changeZoom(-0.1)" style="padding: 4px 8px;">🔍 -</button>
        <span id="zoomValDisplay" style="font-size: 0.85rem; font-weight: bold;">100%</span>
        <button onclick="changeZoom(0.1)" style="padding: 4px 8px;">🔍 +</button>
        <button onclick="resetZoom()" style="padding: 4px 8px; background: #555;">Restablecer</button>
        <button onclick="downloadAllCardsPNG()" style="background: #2e7d32;">💾 Descargar Imagen (PNG)</button>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Fichas</button>
        <button class="btn-danger" onclick="closeCardsModal()">Cerrar</button>
      </div>
    </div>
    <div id="cardsPrintContainer" class="cards-preview-grid"></div>
  </div>
</div>

<script>
  const SPONSORS = {
    "Ninguno": "Ninguna",
    "La Alcaidesa": "Agresivo, Rudo",
    "Beverly, La Diablesa de la Autopista": "Aterrador, Macizo",
    "Los Contrabandistas de Rusty": "Macizo, Temerario",
    "Idris": "Preciso, Velocidad",
    "Maxxine": "Persecución, Tuneo",
    "Mishkin": "Militar, Tecnología",
    "Miyazaki": "Intrépido, Preciso",
    "La Orden Infernal": "Aterrador, Velocidad",
    "La Patrulla de la Autopista": "Persecución, Velocidad",
    "Rutherford": "Militar, Rudo",
    "Scarlett": "Agresivo, Tuneo",
    "Slime": "Temerario, Tuneo",
    "Verney": "Macizo, Tecnología"
  };

  const VEHICLES = [

  let team = [];

  function createNewSquadron() {
    if (team.length > 0) {
      const confirmReset = confirm("¿Estás seguro de que deseas reiniciar todo? Se eliminarán los vehículos creados.");
      if (!confirmReset) return;
    }
    team = [];
    document.getElementById('teamName').value = "Mi Escudería";
    document.getElementById('sponsorSelect').value = "Ninguno";
    document.getElementById('maxCansSelect').value = "50";
    renderBuilder();
  }

  function getItemCost(wData, currentSponsor) {
    if (!wData) return 0;
    if (currentSponsor === "Idris" && wData.name === "Impulsor de nitrometano") return 3;
    if (currentSponsor === "Scarlett" && wData.name === "Tripulante adicional") return 2;
    if (wData.name === "Sirena Mejorada") return 2;
    if (wData.name === "Blindaje de micro placas") return 6;
    if (wData.name === "Vehículo carcelario (especial)") return 0;
    return wData.bidones || 0;
  }

  function getItemSlots(wData, currentSponsor) {
    if (!wData) return 0;
    if (currentSponsor === "Slime" && wData.name === "Ariete") return 0;
    if (wData.name === "Sirena Mejorada") return 0;
    if (wData.name === "Blindaje de micro placas") return 0;
    if (wData.name === "Vehículo carcelario (especial)") return 0;
    return wData.slots || 0;
  }

  function getWeaponRules(wData, currentSponsor) {
    if (!wData) return "";
    let rules = wData.rules || "-";
    if (currentSponsor === "Rutherford" && rules.toLowerCase().includes("munición 3")) {
      rules = rules.replace(/Munición 3/gi, "Munición 4");
    }
    return rules;
  }

  function is360Native(weapon) {
    if (!weapon || weapon.name === "Ninguna") return false;
    if (weapon.category === "Personal") return true;
    const r = weapon.rules ? weapon.rules.toLowerCase() : "";
    return r.includes("360º") || r.includes("360 grados");
  }

  function renderCatalog() {
    const vBasic = document.getElementById('catalogVehiclesBasic');
    const vAdv = document.getElementById('catalogVehiclesAdvanced');
    const wBasic = document.getElementById('catalogWeaponsBasic');
    const wAdv = document.getElementById('catalogWeaponsAdvanced');
    const wPersonal = document.getElementById('catalogWeaponsPersonal');
    const wDropped = document.getElementById('catalogWeaponsDropped');
    const vUpgrades = document.getElementById('catalogVehicleUpgrades');

    vBasic.innerHTML = ''; vAdv.innerHTML = ''; wBasic.innerHTML = ''; wAdv.innerHTML = '';
    wPersonal.innerHTML = ''; wDropped.innerHTML = ''; vUpgrades.innerHTML = '';

    VEHICLES.forEach(v => {
      const item = document.createElement('div');
      item.className = 'catalog-item';
      item.innerHTML = `
        <div class="catalog-item-header"><span>${v.name}</span><span style="color: var(--accent-color);">${v.bidones} Bid.</span></div>
        <div class="catalog-stats">
          <span><b>Peso:</b> ${v.weight}</span><span><b>PC:</b> ${v.hull}</span><span><b>Marcha:</b> ${v.gear}</span>
          <span><b>Maniob.:</b> ${v.handling}</span><span><b>Trip.:</b> ${v.crew}</span><span><b>Casillas:</b> ${v.slots}</span>
        </div>
        <div class="catalog-rules"><b>Especial:</b> ${v.rules}</div>
      `;
      if (v.category === "Básico") vBasic.appendChild(item); else vAdv.appendChild(item);
    });

    WEAPONS.filter(w => w.name !== "Ninguna").forEach(w => {
      const item = document.createElement('div');
      item.className = 'catalog-item';
      const sponsorText = w.sponsor ? `<span class="sponsor-badge">[${w.sponsor}]</span>` : '';
      
      if (w.category === "Mejora") {
        item.innerHTML = `
          <div class="catalog-item-header"><span>${w.name} ${sponsorText}</span><span style="color: var(--accent-color);">${w.bidones} Bid.</span></div>
          <div class="catalog-stats"><span><b>Casillas:</b> ${w.slots}</span></div>
          <div class="catalog-rules"><b>Efectos:</b> ${w.rules}</div>
        `;
        vUpgrades.appendChild(item);
      } else {
        item.innerHTML = `
          <div class="catalog-item-header"><span>${w.name} ${sponsorText}</span><span style="color: var(--accent-color);">${w.bidones} Bid.</span></div>
          <div class="catalog-stats"><span><b>Alcance:</b> ${w.range}</span><span><b>Ataque:</b> ${w.attack}</span><span><b>Casillas:</b> ${w.slots}</span></div>
          <div class="catalog-rules"><b>Especial:</b> ${w.rules}</div>
        `;
        if (w.category === "Básico") wBasic.appendChild(item);
        else if (w.category === "Avanzado") wAdv.appendChild(item);
        else if (w.category === "Personal") wPersonal.appendChild(item);
        else if (w.category === "Descarga") wDropped.appendChild(item);
      }
    });

    const turretItem = document.createElement('div');
    turretItem.className = 'catalog-item';
    turretItem.innerHTML = `
      <div class="catalog-item-header"><span>Torreta</span><span style="color: var(--accent-color);">-</span></div>
      <div class="catalog-stats"><span><b>Casillas:</b> 0</span></div>
      <div class="catalog-rules"><b>Efectos:</b> Otorga arco de fuego de 360º al arma equipada (Multiplica su costo x3).</div>
    `;
    vUpgrades.appendChild(turretItem);
  }

  function addVehicle() {
    const newVehicle = {
      id: Date.now(),
      name: "Nuevo Vehículo",
      type: "",
      weapons: [],
      upgrades: [],
      perks: []
    };
    team.push(newVehicle);
    renderBuilder();
  }

  function removeVehicle(id) {
    team = team.filter(v => v.id !== id);
    renderBuilder();
  }

  function updateVehicleType(id, newType) {
    const v = team.find(item => item.id === id);
    if (v) {
      v.type = newType;
      v.weapons = [];
      v.upgrades = [];
      v.perks = [];
      renderBuilder();
    }
  }

  function addWeaponToVehicle(id) {
    const v = team.find(item => item.id === id);
    if (v) {
      v.weapons.push({ name: "Ninguna", facing: "Frontal" });
      renderBuilder();
    }
  }

  function removeWeaponFromVehicle(id, index) {
    const v = team.find(item => item.id === id);
    if (v && v.weapons[index]) {
      v.weapons.splice(index, 1);
      renderBuilder();
    }
  }

  function updateWeaponName(id, index, weaponName) {
    const v = team.find(item => item.id === id);
    if (v && v.weapons[index]) {
      v.weapons[index].name = weaponName;
      const wData = WEAPONS.find(w => w.name === weaponName);
      if (wData && wData.category === "Descarga") {
        if (v.weapons[index].facing !== "Posterior" && v.weapons[index].facing !== "Lateral") {
          v.weapons[index].facing = "Posterior";
        }
      } else if (wData && is360Native(wData)) {
        v.weapons[index].facing = "360º";
      } else if (v.weapons[index].facing === "360º" && (!wData || !is360Native(wData))) {
        v.weapons[index].facing = "Frontal";
      }
      renderBuilder();
    }
  }

  function updateWeaponFacing(id, index, facingValue) {
    const v = team.find(item => item.id === id);
    if (v && v.weapons[index]) {
      v.weapons[index].facing = facingValue;
      renderBuilder();
    }
  }

  function addUpgradeToVehicle(id) {
    const v = team.find(item => item.id === id);
    if (v) {
      v.upgrades.push({ name: "Ninguna" });
      renderBuilder();
    }
  }

  function removeUpgradeFromVehicle(id, index) {
    const v = team.find(item => item.id === id);
    if (v && v.upgrades[index]) {
      v.upgrades.splice(index, 1);
      renderBuilder();
    }
  }

  function updateUpgradeName(id, index, upgradeName) {
    const v = team.find(item => item.id === id);
    if (v && v.upgrades[index]) {
      v.upgrades[index].name = upgradeName;
      if (upgradeName === "Ariete" || upgradeName === "Ariete explosivo") {
        v.upgrades[index].facing = "Frontal";
      } else {
        delete v.upgrades[index].facing;
      }
      renderBuilder();
    }
  }

  function updateUpgradeFacing(id, index, facingValue) {
    const v = team.find(item => item.id === id);
    if (v && v.upgrades[index]) {
      v.upgrades[index].facing = facingValue;
      renderBuilder();
    }
  }

  function addPerkToVehicle(id) {
    const v = team.find(item => item.id === id);
    if (v) {
      if (!v.perks) v.perks = [];
      v.perks.push({ name: "Ninguna" });
      renderBuilder();
    }
  }

  function removePerkFromVehicle(id, index) {
    const v = team.find(item => item.id === id);
    if (v && v.perks && v.perks[index]) {
      v.perks.splice(index, 1);
      renderBuilder();
    }
  }

  function updatePerkName(id, index, perkName) {
    const v = team.find(item => item.id === id);
    if (v && v.perks && v.perks[index]) {
      v.perks[index].name = perkName;
      renderBuilder();
    }
  }

  function isVehicleDisabledForSponsor(vItem, currentSponsor, currentVehicleId) {
    if (currentSponsor === "Idris" && vItem.name === "Girocóptero") return true;
    if (currentSponsor === "Rutherford" && vItem.weight === "Ligero") return true;
    if (currentSponsor === "Miyazaki" && (vItem.weight === "Pesado" || vItem.gear <= 3)) return true;

    if (currentSponsor === "Rutherford") {
      const otherVehicles = team.filter(v => v.id !== currentVehicleId);
      if (vItem.name === "Tanque" && otherVehicles.some(v => v.type === "Tanque")) return true;
      if (vItem.name === "Helicóptero" && otherVehicles.some(v => v.type === "Helicóptero")) return true;
    }
    return false;
  }

  function getWeaponsSelectOptionsHTML(selectedName, currentSponsor, isSlotsFull) {
    let html = `<option value="Ninguna" ${selectedName === "Ninguna" ? 'selected' : ''}>-- Seleccionar Arma --</option>`;
    
    const categories = [
      { name: "Básico", label: "Armamento Básico", class: "grp-a-basico" },
      { name: "Avanzado", label: "Armamento Avanzado", class: "grp-a-avanzado" },
      { name: "Personal", label: "Armamento Avanzado (Personales)", class: "grp-a-personal" },
      { name: "Descarga", label: "Armamento Avanzado (Descarga)", class: "grp-a-descarga" }
    ];

    categories.forEach(cat => {
      const items = WEAPONS.filter(w => w.category === cat.name && w.name !== "Ninguna");
      if(items.length > 0) {
        html += `<optgroup label="${cat.label}" class="${cat.class}">`;
        items.forEach(w => {
          const isMishkinRequired = w.sponsor === "Mishkin";
          let isDisabled = isMishkinRequired && currentSponsor !== "Mishkin";
          const isSelected = w.name === selectedName;
          const slots = getItemSlots(w, currentSponsor);
          const cost = getItemCost(w, currentSponsor);

          if (isSlotsFull && slots > 0 && !isSelected) {
            isDisabled = true;
          }

          let label = `${w.name} (${cost} Bid. | ${slots} Slot)`;
          if (isMishkinRequired) label += ` [Mishkin]`;
          if (isDisabled) label += ` (No disponible)`;

          html += `<option value="${w.name}" ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}>${label}</option>`;
        });
        html += `</optgroup>`;
      }
    });
    return html;
  }

  function getUpgradesSelectOptionsHTML(selectedName, currentSponsor, vehicleData, currentUpgrades, currentIndex, isSlotsFull) {
    let html = `<option value="Ninguna" ${selectedName === "Ninguna" ? 'selected' : ''}>-- Seleccionar Mejora --</option>`;
    
    const items = WEAPONS.filter(w => w.category === "Mejora" && w.name !== "Ninguna");
    html += `<optgroup label="Mejoras para Vehículo" class="grp-m-vehiculo">`;

    const equippedNames = currentUpgrades.map((u, idx) => idx !== currentIndex ? u.name : null).filter(Boolean);
    const crewUpgradeCount = currentUpgrades.filter((u, idx) => idx !== currentIndex && u.name === "Tripulante adicional").length;

    const uniqueUpgrades = [
      "Impulsor de nitrometano",
      "Jaula de seguridad",
      "Motor nuclear experimental",
      "Orugas",
      "Teleportador experimental",
      "Tubo lanzamierdas",
      "Vehículo carcelario (especial)",
      "Sirena Mejorada",
      "Blindaje de micro placas"
    ];

    items.forEach(w => {
      let isDisabled = false;
      const isSelected = w.name === selectedName;

      if (w.sponsor && w.sponsor !== currentSponsor) isDisabled = true;
      if (uniqueUpgrades.includes(w.name) && equippedNames.includes(w.name)) isDisabled = true;
      if (w.name === "Motor nuclear experimental" && vehicleData && vehicleData.weight === "Ligero") isDisabled = true;
      if (w.name === "Orugas" && vehicleData && (vehicleData.name === "Tanque" || vehicleData.name === "Girocóptero" || vehicleData.name === "Helicóptero")) isDisabled = true;
      if (w.name === "Tripulante adicional" && vehicleData && crewUpgradeCount >= vehicleData.crew) isDisabled = true;
      if (w.name === "Vehículo carcelario (especial)" && vehicleData && vehicleData.weight !== "Medio") isDisabled = true;

      const slots = getItemSlots(w, currentSponsor);
      const cost = getItemCost(w, currentSponsor);

      if (isSlotsFull && slots > 0 && !isSelected) {
        isDisabled = true;
      }

      let label = `${w.name} (${cost} Bid. | ${slots} Slot)`;
      if (w.sponsor) label += ` [${w.sponsor}]`;
      if (isDisabled) label += ` (No disponible)`;

      html += `<option value="${w.name}" ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}>${label}</option>`;
    });

    html += `</optgroup>`;
    return html;
  }

  function getPerksSelectOptionsHTML(selectedName, currentSponsor, vehicleData, currentPerks, currentIndex) {
    let html = `<option value="Ninguna" ${selectedName === "Ninguna" ? 'selected' : ''}>-- Seleccionar Ventaja --</option>`;

    const activePerksString = SPONSORS[currentSponsor] || "";
    const activePerkTypes = activePerksString !== "Ninguna" ? activePerksString.split(',').map(s => s.trim()) : [];

    if (activePerkTypes.length === 0) {
      return html + `<option value="" disabled>(Selecciona un patrocinador para habilitar ventajas)</option>`;
    }

    const equippedPerkNames = (currentPerks || []).map((p, idx) => idx !== currentIndex ? p.name : null).filter(Boolean);

    activePerkTypes.forEach(perkType => {
      const typeItems = PERKS.filter(p => p.category === perkType);
      if (typeItems.length > 0) {
        const cssClass = `grp-pk-${perkType.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")}`;
        html += `<optgroup label="Ventajas de ${perkType}" class="${cssClass}">`;

        typeItems.forEach(p => {
          let isDisabled = false;
          const isSelected = p.name === selectedName;

          if (equippedPerkNames.includes(p.name)) isDisabled = true;

          // Condicional especial: Conductor Especialista
          if (p.name === "Conductor Especialista" && vehicleData) {
            const isValidWeight = vehicleData.weight === "Ligero" || vehicleData.weight === "Medio";
            const isValidHandling = vehicleData.handling >= 3;
            if (!isValidWeight || !isValidHandling) isDisabled = true;
          }

          let label = `${p.name} (${p.cost} Bid.)`;
          if (p.cond !== "-") label += ` [${p.cond}]`;
          if (isDisabled) label += ` (No disponible)`;

          html += `<option value="${p.name}" ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}>${label}</option>`;
        });

        html += `</optgroup>`;
      }
    });

    return html;
  }

  function renderBuilder() {
    const container = document.getElementById('vehiclesList');
    container.innerHTML = '';
    let grandTotalBidones = 0;
    const maxCans = parseInt(document.getElementById('maxCansSelect').value) || 0;
    const currentSponsor = document.getElementById('sponsorSelect').value;
    const sponsorPerks = SPONSORS[currentSponsor] || "Ninguna";
    const perksElem = document.getElementById('sponsorPerksDisplay');
    if (perksElem) {
      perksElem.innerHTML = `<b>Ventajas:</b> ${sponsorPerks}`;
    }

    document.getElementById('maxBidonesDisplay').innerText = maxCans;

    team.forEach((v) => {
      let vData = VEHICLES.find(item => item.name === v.type);

      if (!v.perks) v.perks = [];

      // Deshabilitar tipo si viola regla de patrocinador activo
      if (vData && isVehicleDisabledForSponsor(vData, currentSponsor, v.id)) {
        v.type = "";
        v.weapons = [];
        v.upgrades = [];
        v.perks = [];
        vData = null;
      }
      
      let baseCost = vData ? vData.bidones : 0;
      let usedSlots = 0;

      // Limpieza de armas/mejoras no permitidas con el nuevo patrocinador
      if (v.weapons) {
        v.weapons.forEach(w => {
          const wData = WEAPONS.find(item => item.name === w.name);
          if (wData && wData.sponsor && wData.sponsor !== currentSponsor) {
            w.name = "Ninguna";
          }
        });
      }

      if (v.upgrades && vData) {
        v.upgrades.forEach(u => {
          const uData = WEAPONS.find(item => item.name === u.name);
          if (uData && uData.sponsor && uData.sponsor !== currentSponsor) u.name = "Ninguna";
          if (u.name === "Motor nuclear experimental" && vData.weight === "Ligero") u.name = "Ninguna";
          if (u.name === "Orugas" && (vData.name === "Tanque" || vData.name === "Girocóptero" || vData.name === "Helicóptero")) u.name = "Ninguna";
          if (u.name === "Vehículo carcelario (especial)" && vData.weight !== "Medio") u.name = "Ninguna";
        });
      }

      // Limpieza de ventajas no permitidas por el patrocinador activo o condicionales
      const activePerksString = SPONSORS[currentSponsor] || "";
      const activePerkTypes = activePerksString !== "Ninguna" ? activePerksString.split(',').map(s => s.trim()) : [];

      if (v.perks) {
        v.perks.forEach(p => {
          const pData = PERKS.find(item => item.name === p.name);
          if (pData) {
            if (!activePerkTypes.includes(pData.category)) p.name = "Ninguna";
            if (pData.name === "Conductor Especialista" && vData) {
              const isValidWeight = vData.weight === "Ligero" || vData.weight === "Medio";
              const isValidHandling = vData.handling >= 3;
              if (!isValidWeight || !isValidHandling) p.name = "Ninguna";
            }
          }
        });
      }

      // Regla La Alcaidesa: Descuento hasta en 4 bidones (Mín. 5 BD base)
      const hasCarcelario = v.upgrades && v.upgrades.some(u => u.name === "Vehículo carcelario (especial)");
      if (currentSponsor === "La Alcaidesa" && hasCarcelario && vData && vData.weight === "Medio") {
        baseCost = Math.max(5, baseCost - 4);
      }

      let vehicleBidones = baseCost;

      if (v.weapons) {
        v.weapons.forEach(w => {
          const wData = WEAPONS.find(item => item.name === w.name);
          if (wData && wData.name !== "Ninguna") {
            usedSlots += getItemSlots(wData, currentSponsor);
            let cost = getItemCost(wData, currentSponsor);
            if (w.facing === "360º" && !is360Native(wData)) cost *= 3;
            vehicleBidones += cost;
          }
        });
      }

      let armorCount = 0;
      let extraCrewCount = 0;
      let hasMicroPlacas = false;

      if (v.upgrades) {
        v.upgrades.forEach(u => {
          const uData = WEAPONS.find(item => item.name === u.name);
          if (uData && uData.name !== "Ninguna") {
            usedSlots += getItemSlots(uData, currentSponsor);
            vehicleBidones += getItemCost(uData, currentSponsor);
            if (u.name === "Blindaje") armorCount++;
            if (u.name === "Tripulante adicional") extraCrewCount++;
            if (u.name === "Blindaje de micro placas") hasMicroPlacas = true;
          }
        });
      }

      if (v.perks) {
        v.perks.forEach(p => {
          const pData = PERKS.find(item => item.name === p.name);
          if (pData) {
            vehicleBidones += pData.cost;
          }
        });
      }

      grandTotalBidones += vehicleBidones;

      const card = document.createElement('div');
      card.className = 'vehicle-card';
      if (vData) {
        card.style.borderLeft = `5px solid ${vData.category === 'Básico' ? 'var(--cat-veh-basico)' : 'var(--cat-veh-avanzado)'}`;
      }

      let innerHTML = `
        <div class="vehicle-header">
          <input type="text" value="${v.name}" onchange="updateVehicle(${v.id}, 'name', this.value)" style="font-weight: bold; width: 55%;">
          <div>
            <strong>${vehicleBidones} Bid.</strong> ${vData ? `| <span style="color: ${usedSlots > vData.slots ? '#ff4444' : '#888'}">Slots: ${usedSlots}/${vData.slots}</span>` : ''}
            <button class="btn-danger" style="margin-left: 10px;" onclick="removeVehicle(${v.id})">X</button>
          </div>
        </div>
        <div class="grid">
          <div>
            <label>Tipo de Vehículo:</label>
            <select onchange="updateVehicleType(${v.id}, this.value)">
              <option value="">-- Seleccionar Vehículo --</option>
              <optgroup label="Vehículos Básicos" class="grp-v-basico">
                ${VEHICLES.filter(item => item.category === 'Básico').map(vItem => {
                  const disabled = isVehicleDisabledForSponsor(vItem, currentSponsor, v.id);
                  return `<option value="${vItem.name}" ${vItem.name === v.type ? 'selected' : ''} ${disabled ? 'disabled' : ''}>${vItem.name} (${vItem.bidones} Bid. | ${vItem.slots} Slots)${disabled ? ' (Restringido)' : ''}</option>`;
                }).join('')}
              </optgroup>
              <optgroup label="Vehículos Avanzados" class="grp-v-avanzado">
                ${VEHICLES.filter(item => item.category === 'Avanzado').map(vItem => {
                  const disabled = isVehicleDisabledForSponsor(vItem, currentSponsor, v.id);
                  return `<option value="${vItem.name}" ${vItem.name === v.type ? 'selected' : ''} ${disabled ? 'disabled' : ''}>${vItem.name} (${vItem.bidones} Bid. | ${vItem.slots} Slots)${disabled ? ' (Restringido)' : ''}</option>`;
                }).join('')}
              </optgroup>
            </select>
          </div>
        </div>
      `;

      if (!vData) {
        innerHTML += `<div style="color: var(--text-muted); font-style: italic; margin-top: 10px;">Selecciona un tipo de vehículo válido para comenzar la configuración.</div>`;
      } else {
        let currentHull = vData.hull + (armorCount * 2);
        if (currentSponsor === "La Alcaidesa" && hasCarcelario && vData.weight === "Medio") {
          currentHull = Math.max(1, currentHull - 2);
        }
        if (currentSponsor === "Verney" && hasMicroPlacas) {
          currentHull += 2;
        }

        const currentCrew = vData.crew + extraCrewCount;

        const hullClass = (armorCount > 0 || hasCarcelario || hasMicroPlacas) ? "stat-modified-hull" : "";
        const crewClass = extraCrewCount > 0 ? "stat-modified-crew" : "";

        innerHTML += `
          <div class="vehicle-stats-box">
            <div class="vehicle-stats-grid">
              <span><b>Peso:</b> ${vData.weight}</span>
              <span class="${hullClass}"><b>Carrocería:</b> ${currentHull} PC</span>
              <span><b>Maniobra:</b> ${vData.handling}</span>
              <span><b>Marcha Máx:</b> ${vData.gear}</span>
              <span class="${crewClass}"><b>Tripulación:</b> ${currentCrew} ${extraCrewCount > 0 ? `(+${extraCrewCount})` : ''}</span>
            </div>
            <div style="color: #7dcfb6;"><b>Reglas Especiales:</b> ${vData.rules}</div>
          </div>
        `;

        const isSlotsFull = usedSlots >= vData.slots;

        // SECCIÓN DE ARMAS
        innerHTML += `
          <div class="section-block">
            <div class="section-title">
              <span>Sección de Armas</span>
              <button class="btn-add" onclick="addWeaponToVehicle(${v.id})">+ Añadir Arma</button>
            </div>
            <div class="fixed-weapon-badge">
              <b>Arma Integrada por Defecto:</b> Arma corta (Alcance: Medio | Ataque: 1d6 | Reglas: Personal | Coste: 0 Bid. | Encaramiento: 360º)
            </div>
        `;

        v.weapons.forEach((w, wIdx) => {
          const wData = WEAPONS.find(item => item.name === w.name);
          const isSelected = wData && wData.name !== "Ninguna";
          const native360 = isSelected && is360Native(wData);
          const isPersonal = isSelected && wData.category === "Personal";
          const disableFacing = !isSelected || isPersonal || native360;

          let currentCost = isSelected ? getItemCost(wData, currentSponsor) : 0;
          if (isSelected && w.facing === "360º" && !native360) currentCost *= 3;
          const displayRules = isSelected ? getWeaponRules(wData, currentSponsor) : "-";

          innerHTML += `
            <div class="upgrade-row">
              <div class="upgrade-controls">
                <div>
                  <label style="font-size: 0.8em; color: var(--text-muted);">Arma ${wIdx + 1}:</label>
                  <select onchange="updateWeaponName(${v.id}, ${wIdx}, this.value)">
                    ${getWeaponsSelectOptionsHTML(w.name, currentSponsor, isSlotsFull)}
                  </select>
                </div>
                <div>
                  <label style="font-size: 0.8em; color: var(--text-muted);">Encaramiento:</label>
                  <select ${disableFacing ? 'disabled' : ''} onchange="updateWeaponFacing(${v.id}, ${wIdx}, this.value)">
                    ${(wData && wData.category === 'Descarga') ? `
                      <option value="Posterior" ${w.facing === 'Posterior' ? 'selected' : ''}>Posterior</option>
                      <option value="Lateral" ${w.facing === 'Lateral' ? 'selected' : ''}>Lateral</option>
                    ` : `
                      <option value="Frontal" ${w.facing === 'Frontal' ? 'selected' : ''}>Frontal</option>
                      <option value="Posterior" ${w.facing === 'Posterior' ? 'selected' : ''}>Posterior</option>
                      <option value="Lateral" ${w.facing === 'Lateral' ? 'selected' : ''}>Lateral</option>
                      <option value="360º" ${w.facing === '360º' ? 'selected' : ''}>360º (Torreta)</option>
                    `}
                  </select>
                </div>
                <div>
                  <button class="btn-danger" onclick="removeWeaponFromVehicle(${v.id}, ${wIdx})">X</button>
                </div>
              </div>
              ${isSelected ? `
              <div class="weapon-details-badge">
                <span><b>Alcance:</b> ${wData.range}</span>
                <span><b>Ataque:</b> ${wData.attack}</span>
                <span><b>Especial:</b> ${displayRules}</span>
                <span><b>Coste Total:</b> ${currentCost} Bid.</span>
              </div>` : '<div style="font-size: 0.8em; color: var(--text-muted); font-style: italic;">Selecciona un arma de la lista.</div>'}
            </div>
          `;
        });
        innerHTML += `</div>`;

        // SECCIÓN DE MEJORAS
        innerHTML += `
          <div class="section-block">
            <div class="section-title">
              <span>Sección de Mejoras</span>
              <button class="btn-add" onclick="addUpgradeToVehicle(${v.id})">+ Añadir Mejora</button>
            </div>
        `;

        v.upgrades.forEach((u, uIdx) => {
          const uData = WEAPONS.find(item => item.name === u.name);
          const isSelected = uData && uData.name !== "Ninguna";
          const isRam = isSelected && (u.name === "Ariete" || u.name === "Ariete explosivo");
          const currentCost = isSelected ? getItemCost(uData, currentSponsor) : 0;

          innerHTML += `
            <div class="upgrade-row">
              <div class="upgrade-controls">
                <div>
                  <label style="font-size: 0.8em; color: var(--text-muted);">Mejora ${uIdx + 1}:</label>
                  <select onchange="updateUpgradeName(${v.id}, ${uIdx}, this.value)">
                    ${getUpgradesSelectOptionsHTML(u.name, currentSponsor, vData, v.upgrades, uIdx, isSlotsFull)}
                  </select>
                </div>
                <div>
                  <label style="font-size: 0.8em; color: var(--text-muted);">Encaramiento:</label>
                  <select ${!isRam ? 'disabled' : ''} onchange="updateUpgradeFacing(${v.id}, ${uIdx}, this.value)">
                    ${!isRam ? `<option value="N/A" selected>N/A</option>` : `
                      <option value="Frontal" ${u.facing === 'Frontal' ? 'selected' : ''}>Frontal</option>
                      <option value="Posterior" ${u.facing === 'Posterior' ? 'selected' : ''}>Posterior</option>
                      <option value="Lateral" ${u.facing === 'Lateral' ? 'selected' : ''}>Lateral</option>
                    `}
                  </select>
                </div>
                <div>
                  <button class="btn-danger" onclick="removeUpgradeFromVehicle(${v.id}, ${uIdx})">X</button>
                </div>
              </div>
              ${isSelected ? `
              <div class="weapon-details-badge">
                <span><b>Efectos:</b> ${uData.rules}</span>
                <span><b>Coste Total:</b> ${currentCost} Bid.</span>
              </div>` : '<div style="font-size: 0.8em; color: var(--text-muted); font-style: italic;">Selecciona una mejora de la lista.</div>'}
            </div>
          `;
        });
        innerHTML += `</div>`;

        // SECCIÓN DE VENTAJAS DE PATROCINADOR
        innerHTML += `
          <div class="section-block">
            <div class="section-title">
              <span>Sección de Ventajas</span>
              <button class="btn-add" onclick="addPerkToVehicle(${v.id})">+ Añadir Ventaja</button>
            </div>
        `;

        v.perks.forEach((p, pIdx) => {
          const pData = PERKS.find(item => item.name === p.name);
          const isSelected = pData && pData.name !== "Ninguna";

          innerHTML += `
            <div class="upgrade-row">
              <div class="perk-controls">
                <div>
                  <label style="font-size: 0.8em; color: var(--text-muted);">Ventaja ${pIdx + 1}:</label>
                  <select onchange="updatePerkName(${v.id}, ${pIdx}, this.value)">
                    ${getPerksSelectOptionsHTML(p.name, currentSponsor, vData, v.perks, pIdx)}
                  </select>
                </div>
                <div>
                  <button class="btn-danger" onclick="removePerkFromVehicle(${v.id}, ${pIdx})">X</button>
                </div>
              </div>
              ${isSelected ? `
              <div class="weapon-details-badge">
                <span><b>Tipo:</b> ${pData.category}</span>
                <span><b>Condicional:</b> ${pData.cond}</span>
                <span><b>Coste Total:</b> ${pData.cost} Bid.</span>
              </div>` : '<div style="font-size: 0.8em; color: var(--text-muted); font-style: italic;">Selecciona una ventaja de la lista.</div>'}
            </div>
          `;
        });
        innerHTML += `</div>`;
      }

      card.innerHTML = innerHTML;
      container.appendChild(card);
    });

    const totalElement = document.getElementById('totalBidones');
    totalElement.innerText = grandTotalBidones;
    if (grandTotalBidones > maxCans) {
      totalElement.style.color = '#ff4444';
    } else {
      totalElement.style.color = '#fff';
    }
  }

  function updateVehicle(id, field, value) {
    const v = team.find(item => item.id === id);
    if (v) {
      v[field] = value;
      renderBuilder();
    }
  }

  let currentZoom = 1.0;

  function changeZoom(delta) {
    currentZoom = Math.min(Math.max(currentZoom + delta, 0.5), 2.0);
    applyZoom();
  }

  function resetZoom() {
    currentZoom = 1.0;
    applyZoom();
  }

  function applyZoom() {
    const grid = document.getElementById('cardsPrintContainer');
    if (grid) {
      grid.style.transform = `scale(${currentZoom})`;
      grid.style.transformOrigin = 'top center';
    }
    const zoomDisplay = document.getElementById('zoomValDisplay');
    if (zoomDisplay) {
      zoomDisplay.innerText = `${Math.round(currentZoom * 100)}%`;
    }
  }

  function downloadAllCardsPNG() {
    const cards = document.querySelectorAll('.printable-card');
    if (!cards || cards.length === 0) return;

    cards.forEach((card, idx) => {
      html2canvas(card, { scale: 3 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Ficha_Vehiculo_${idx + 1}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    });
  }

  function getAmmoBoxesHTML(rules) {
    if (!rules) return '';
    const match = rules.match(/munición\s*(\d+)/i) || rules.match(/municion\s*(\d+)/i);
    if (match && match[1]) {
      const count = parseInt(match[1]);
      let boxes = '';
      for (let i = 0; i < count; i++) {
        boxes += `<span class="card-ammo-box"></span>`;
      }
      return `<div class="ammo-container">Mun (${count}): ${boxes}</div>`;
    }
    return '';
  }

  // LÓGICA DE GENERACIÓN DE FICHAS TIPO CARTA STANDARD (63mm x 88mm)
  function openCardsModal() {
    const modal = document.getElementById('cardsModal');
    const container = document.getElementById('cardsPrintContainer');
    const teamName = document.getElementById('teamName').value || 'Mi Escudería';
    const sponsorName = document.getElementById('sponsorSelect').value;
    const sponsorPerks = SPONSORS[sponsorName] || "Ninguna";

    container.innerHTML = '';
    resetZoom();

    if (team.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 20px; color:#fff;">No hay vehículos configurados en la escudería.</div>`;
      modal.style.display = 'flex';
      return;
    }

    team.forEach(v => {
      const vData = VEHICLES.find(item => item.name === v.type);
      if (!vData) return;

      const hasCarcelario = v.upgrades && v.upgrades.some(u => u.name === "Vehículo carcelario (especial)");
      let baseCost = vData.bidones;
      if (sponsorName === "La Alcaidesa" && hasCarcelario && vData.weight === "Medio") {
        baseCost = Math.max(5, baseCost - 4);
      }

      let vehicleBidones = baseCost;

      if (v.weapons) {
        v.weapons.forEach(w => {
          const wData = WEAPONS.find(item => item.name === w.name);
          if (wData && wData.name !== "Ninguna") {
            let cost = getItemCost(wData, sponsorName);
            if (w.facing === "360º" && !is360Native(wData)) cost *= 3;
            vehicleBidones += cost;
          }
        });
      }

      let armorCount = 0;
      let extraCrewCount = 0;
      let hasMicroPlacas = false;

      if (v.upgrades) {
        v.upgrades.forEach(u => {
          const uData = WEAPONS.find(item => item.name === u.name);
          if (uData && uData.name !== "Ninguna") {
            vehicleBidones += getItemCost(uData, sponsorName);
            if (u.name === "Blindaje") armorCount++;
            if (u.name === "Tripulante adicional") extraCrewCount++;
            if (u.name === "Blindaje de micro placas") hasMicroPlacas = true;
          }
        });
      }

      if (v.perks) {
        v.perks.forEach(p => {
          const pData = PERKS.find(item => item.name === p.name);
          if (pData) {
            vehicleBidones += pData.cost;
          }
        });
      }

      let totalHull = vData.hull + (armorCount * 2);
      if (sponsorName === "La Alcaidesa" && hasCarcelario && vData.weight === "Medio") {
        totalHull = Math.max(1, totalHull - 2);
      }
      if (sponsorName === "Verney" && hasMicroPlacas) {
        totalHull += 2;
      }

      const totalCrew = vData.crew + extraCrewCount;

      let hullBoxesHTML = '';
      for (let i = 0; i < totalHull; i++) {
        hullBoxesHTML += `<span class="card-hull-box"></span>`;
      }

      let weaponsRowsHTML = `
        <tr>
          <td class="left">Arma corta (Pistola)</td>
          <td>Med.</td>
          <td>1d6</td>
          <td>360º</td>
          <td>0</td>
        </tr>
      `;

      if (v.weapons) {
        v.weapons.forEach(w => {
          const wData = WEAPONS.find(item => item.name === w.name);
          if (wData && wData.name !== "Ninguna") {
            let cost = getItemCost(wData, sponsorName);
            if (w.facing === "360º" && !is360Native(wData)) cost *= 3;
            
            let rShort = wData.range;
            if(rShort === "Doble") rShort = "Dob.";
            else if(rShort === "Medio") rShort = "Med.";
            else if(rShort === "Corto") rShort = "Cor.";
            else if(rShort === "Ráfaga larga") rShort = "Ráf.L";

            const activeRules = getWeaponRules(wData, sponsorName);
            const ammoHTML = getAmmoBoxesHTML(activeRules);

            weaponsRowsHTML += `
              <tr>
                <td class="left">
                  ${wData.name}
                  ${ammoHTML}
                </td>
                <td>${rShort}</td>
                <td>${wData.attack}</td>
                <td>${w.facing || 'Front.'}</td>
                <td>${cost}B</td>
              </tr>
            `;
          }
        });
      }

      let upgradesRowsHTML = '';
      const activeUpgrades = v.upgrades ? v.upgrades.filter(u => u.name !== "Ninguna") : [];
      if (activeUpgrades.length > 0) {
        activeUpgrades.forEach(u => {
          const uData = WEAPONS.find(item => item.name === u.name);
          if (uData && uData.name !== "Ninguna") {
            const cost = getItemCost(uData, sponsorName);
            const ammoHTML = getAmmoBoxesHTML(uData.rules);
            upgradesRowsHTML += `
              <tr>
                <td class="left">
                  ${uData.name}
                  ${ammoHTML}
                </td>
                <td>${cost} Bid.</td>
              </tr>
            `;
          }
        });
      } else {
        upgradesRowsHTML = `<tr><td colspan="2" style="font-style:italic;">Sin mejoras</td></tr>`;
      }

      let perksRowsHTML = '';
      const activePerksList = v.perks ? v.perks.filter(p => p.name !== "Ninguna") : [];
      if (activePerksList.length > 0) {
        activePerksList.forEach(p => {
          const pData = PERKS.find(item => item.name === p.name);
          if (pData) {
            perksRowsHTML += `
              <tr>
                <td class="left">${pData.name} (${pData.category})</td>
                <td>${pData.cost} Bid.</td>
              </tr>
            `;
          }
        });
      } else {
        perksRowsHTML = `<tr><td colspan="2" style="font-style:italic;">Sin ventajas equipadas</td></tr>`;
      }

      const cardHTML = `
        <div class="printable-card">
          <div>
            <div class="card-top-bar">
              <span>ESC: ${teamName}</span>
              <span>PAT: ${sponsorName}</span>
              <span style="font-weight: bold; color: #d32f2f;">${vehicleBidones} BID.</span>
            </div>

            <div class="card-title-box">
              <h2>${v.name}</h2>
              <div class="sub">${vData.name} - Peso ${vData.weight}</div>
              <div style="font-size: 5pt; font-weight: bold; color: #d84315; margin-top: 1px;">Reglas: ${vData.rules}</div>
            </div>

            <div class="card-stats-grid">
              <div class="card-stat-box">
                <div class="lbl">Marcha</div>
                <div class="val">${vData.gear}</div>
              </div>
              <div class="card-stat-box">
                <div class="lbl">Peligro</div>
                <div class="val">[ &nbsp; ]</div>
              </div>
              <div class="card-stat-box">
                <div class="lbl">Maniobra</div>
                <div class="val">${vData.handling}</div>
              </div>
              <div class="card-stat-box">
                <div class="lbl">Trip.</div>
                <div class="val">${totalCrew}</div>
              </div>
            </div>

            <div class="card-hull-section">
              <div class="card-hull-header">
                <span>CARROCERÍA</span>
                <span>${totalHull} PC</span>
              </div>
              <div class="card-hull-boxes">
                ${hullBoxesHTML}
              </div>
            </div>

            <div class="card-section-title">Armas Equipadas</div>
            <table class="mini-table">
              <thead>
                <tr>
                  <th style="text-align:left;">Arma</th>
                  <th>Alc.</th>
                  <th>Atq.</th>
                  <th>Enc.</th>
                  <th>Cost.</th>
                </tr>
              </thead>
              <tbody>
                ${weaponsRowsHTML}
              </tbody>
            </table>

            <div class="card-section-title">Mejoras de Vehículo</div>
            <table class="mini-table">
              <thead>
                <tr>
                  <th style="text-align:left;">Mejora</th>
                  <th>Coste</th>
                </tr>
              </thead>
              <tbody>
                ${upgradesRowsHTML}
              </tbody>
            </table>

            <div class="card-section-title">Ventajas Seleccionadas</div>
            <table class="mini-table">
              <thead>
                <tr>
                  <th style="text-align:left;">Ventaja</th>
                  <th>Coste</th>
                </tr>
              </thead>
              <tbody>
                ${perksRowsHTML}
              </tbody>
            </table>
          </div>

          <div class="card-footer">
            Nexo Alpha - Gaslands Refuelled
          </div>
        </div>
      `;

      container.innerHTML += cardHTML;
    });

    modal.style.display = 'flex';
  }

  function closeCardsModal() {
    document.getElementById('cardsModal').style.display = 'none';
  }

  renderCatalog();
  addVehicle();
</script>
</body>
</html>

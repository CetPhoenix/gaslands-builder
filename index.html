<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo Alpha - Gaslands Refuelled</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --card-bg: #2a2a2a;
      --accent-color: #ff5500;
      --accent-hover: #e04b00;
      --text-color: #f0f0f0;
      --text-muted: #aaa;
      --text-disabled: #555555;
      --border-color: #333;
      --danger-color: #cc2929;

      /* Colores por Categoría de Vehículos */
      --cat-veh-basico: #2196F3;
      --cat-veh-avanzado: #9C27B0;

      /* Colores por Categoría de Armas/Mejoras */
      --cat-arm-basico: #4CAF50;
      --cat-arm-avanzado: #FF9800;
      --cat-arm-personal: #00BCD4;
      --cat-arm-descarga: #E91E63;
      --cat-mejora-veh: #FFD700;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; color: var(--accent-color); font-size: 1.8rem; }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 450px;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .main-layout { grid-template-columns: 1fr; }
    }

    .summary-bar {
      background: var(--panel-bg);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .vehicle-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      position: relative;
    }

    .vehicle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .vehicle-stats-box {
      background: #242424;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 15px;
      font-size: 0.85rem;
    }

    .vehicle-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 6px;
      margin-bottom: 6px;
    }

    .vehicle-stats-grid span {
      background: #1a1a1a;
      padding: 4px 6px;
      border-radius: 3px;
      color: var(--text-muted);
    }

    .stat-modified-hull { color: #ff9800 !important; font-weight: bold; }
    .stat-modified-crew { color: #ff4444 !important; font-weight: bold; }

    .section-block {
      background: #181818;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .upgrade-row {
      background: #242424;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .upgrade-controls {
      display: grid;
      grid-template-columns: 1fr 130px 40px;
      gap: 8px;
      align-items: end;
    }

    @media (max-width: 600px) {
      .upgrade-controls { grid-template-columns: 1fr; }
    }

    .weapon-details-badge {
      background: #1a1a1a;
      border: 1px dashed #444;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #7dcfb6;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    select, input {
      width: 100%;
      padding: 8px;
      background: #2b2b2b;
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
    }

    select:disabled, button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    optgroup.grp-v-basico { color: var(--cat-veh-basico); font-weight: bold; }
    optgroup.grp-v-avanzado { color: var(--cat-veh-avanzado); font-weight: bold; }

    optgroup.grp-a-basico { color: var(--cat-arm-basico); font-weight: bold; }
    optgroup.grp-a-avanzado { color: var(--cat-arm-avanzado); font-weight: bold; }
    optgroup.grp-a-personal { color: var(--cat-arm-personal); font-weight: bold; }
    optgroup.grp-a-descarga { color: var(--cat-arm-descarga); font-weight: bold; }
    optgroup.grp-m-vehiculo { color: var(--cat-mejora-veh); font-weight: bold; }
    
    option { color: #ffffff; font-weight: normal; background: #2b2b2b; }
    
    /* Estilo para opciones deshabilitadas en selectores (opaco / gris oscuro) */
    option:disabled {
      color: #666666 !important;
      background-color: #1a1a1a !important;
      font-style: italic;
    }

    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover { background: var(--accent-hover); }
    button.btn-danger { background: var(--danger-color); padding: 8px; }
    button.btn-danger:hover { background: #a81e1e; }
    button.btn-add { background: #2e7d32; font-size: 0.85rem; }
    button.btn-add:hover { background: #1b5e20; }
    button.btn-print { background: #008CBA; }
    button.btn-print:hover { background: #007399; }

    .catalog-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      height: fit-content;
      max-height: 85vh;
      overflow-y: auto;
    }

    .catalog-panel h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    details {
      background: #242424;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 10px;
      padding: 8px 12px;
    }

    summary {
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      outline: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-tag {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }

    .catalog-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .catalog-item-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #fff;
      margin-bottom: 6px;
    }

    .catalog-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .catalog-stats span {
      background: #1a1a1a;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .catalog-rules {
      color: #7dcfb6;
      font-style: italic;
      font-size: 0.8rem;
    }

    .total-display {
      font-weight: bold;
      font-size: 1.05rem;
    }

    .fixed-weapon-badge {
      background: #1b382b;
      border: 1px solid #4CAF50;
      color: #81c784;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }

    .sponsor-badge { color: #FF9800; font-weight: bold; font-size: 0.8rem; }

    /* ESTILOS DEL MODAL DE FICHAS DE VEHÍCULOS */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-content {
      background: #333;
      color: #000;
      width: 95%;
      max-width: 1000px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 8px;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-header-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 2px solid #555;
      padding-bottom: 10px;
      color: #fff;
    }

    .cards-preview-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }

    /* VISTA Y DISEÑO DE LA FICHA TIPO CARTA STANDARD (63mm x 88mm) */
    .printable-card {
      background: #fff;
      color: #000;
      border: 2px solid #000;
      width: 63mm;
      height: 88mm;
      padding: 2.5mm;
      box-sizing: border-box;
      font-size: 6.5pt;
      line-height: 1.1;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      border-radius: 3mm;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      page-break-inside: avoid;
    }

    .card-top-bar {
      border-bottom: 1px solid #000;
      padding-bottom: 1px;
      margin-bottom: 2px;
      font-size: 5.5pt;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      text-transform: uppercase;
    }

    .card-title-box {
      text-align: center;
      border-bottom: 1.5px solid #000;
      padding-bottom: 2px;
      margin-bottom: 3px;
      background: #f0f0f0;
      border-radius: 2px;
    }

    .card-title-box h2 {
      margin: 0;
      font-size: 8.5pt;
      text-transform: uppercase;
      letter-spacing: 0.2px;
      line-height: 1;
    }

    .card-title-box .sub {
      font-size: 5.5pt;
      color: #333;
      font-weight: bold;
    }

    .card-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      margin-bottom: 3px;
    }

    .card-stat-box {
      border: 1px solid #000;
      text-align: center;
      padding: 1px 0;
      border-radius: 2px;
      background: #fafafa;
    }

    .card-stat-box .lbl {
      font-size: 4.5pt;
      font-weight: bold;
      text-transform: uppercase;
      border-bottom: 0.5px solid #888;
      padding-bottom: 1px;
      line-height: 1;
    }

    .card-stat-box .val {
      font-size: 7.5pt;
      font-weight: bold;
      line-height: 1.1;
    }

    .card-hull-section {
      border: 1px solid #000;
      padding: 2px 3px;
      margin-bottom: 3px;
      border-radius: 2px;
      background: #fff;
    }

    .card-hull-header {
      font-size: 5.5pt;
      font-weight: bold;
      margin-bottom: 1px;
      display: flex;
      justify-content: space-between;
    }

    .card-hull-boxes {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5px;
    }

    .card-hull-box {
      width: 3.5mm;
      height: 3.5mm;
      border: 1px solid #000;
      display: inline-block;
      box-sizing: border-box;
      background: #fff;
    }

    .card-section-title {
      font-size: 5.5pt;
      font-weight: bold;
      text-transform: uppercase;
      background: #000;
      color: #fff;
      padding: 1px 3px;
      margin-top: 1px;
      margin-bottom: 1px;
      border-radius: 1px;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 2px;
    }

    .mini-table th, .mini-table td {
      border: 0.5px solid #000;
      padding: 1px 1.5px;
      text-align: center;
      font-size: 5pt;
    }

    .mini-table th {
      background: #ddd;
      font-weight: bold;
      text-transform: uppercase;
    }

    .mini-table td.left {
      text-align: left;
      font-weight: bold;
    }

    .card-footer {
      text-align: center;
      font-size: 4.5pt;
      font-style: italic;
      border-top: 0.5px solid #888;
      padding-top: 1px;
      margin-top: auto;
    }

    /* REGLAS CSS PARA IMPRESIÓN A4 Y DISTRIBUCIÓN DE FICHAS (63mm x 88mm) */
    @media print {
      @page {
        size: A4 portrait;
        margin: 10mm;
      }
      body {
        background: #fff !important;
        color: #000 !important;
        padding: 0 !important;
      }
      header, .main-layout, .modal-header-actions {
        display: none !important;
      }
      .modal-overlay {
        position: static !important;
        display: block !important;
        width: 100% !important;
        height: auto !important;
        background: none !important;
      }
      .modal-content {
        max-width: 100% !important;
        width: 100% !important;
        padding: 0 !important;
        border: none !important;
        background: none !important;
      }
      .cards-preview-grid {
        display: grid !important;
        grid-template-columns: repeat(3, 63mm) !important;
        gap: 4mm 6mm !important;
        justify-content: start !important;
      }
      .printable-card {
        box-shadow: none !important;
        border: 1.5px solid #000 !important;
        page-break-inside: avoid !important;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>Nexo Alpha - Gaslands Refuelled</h1>
</header>

<div class="main-layout">
  <div class="builder-column">
    <div class="summary-bar">
      <div>
        <label>Escudería: </label>
        <input type="text" id="teamName" placeholder="Nombre de tu banda" value="Mi Escudería" onchange="renderBuilder()" style="width: 140px;">
      </div>
      <div>
        <label>Patrocinador: </label>
        <select id="sponsorSelect" onchange="renderBuilder()" style="width: 210px;">
          <option value="Ninguno">Sin Patrocinador</option>
          <option value="La Alcaidesa">La Alcaidesa</option>
          <option value="Beverly, La Diablesa de la Autopista">Beverly, La Diablesa de la Autopista</option>
          <option value="Los Contrabandistas de Rusty">Los Contrabandistas de Rusty</option>
          <option value="Idris">Idris</option>
          <option value="Maxxine">Maxxine</option>
          <option value="Mishkin">Mishkin</option>
          <option value="Miyazaki">Miyazaki</option>
          <option value="La Orden Infernal">La Orden Infernal</option>
          <option value="La Patrulla de la Autopista">La Patrulla de la Autopista</option>
          <option value="Rutherford">Rutherford</option>
          <option value="Scarlett">Scarlett</option>
          <option value="Slime">Slime</option>
          <option value="Verney">Verney</option>
        </select>
        <div id="sponsorPerksDisplay" style="font-size: 0.8rem; color: #7dcfb6; margin-top: 4px;"><b>Ventajas:</b> Ninguna</div>
      </div>
      <div>
        <label>Formato: </label>
        <input type="number" id="maxCansSelect" value="50" min="1" oninput="renderBuilder()" style="width: 75px;">
      </div>
      <div class="total-display">
        Total: <span id="totalBidones">0</span> / <span id="maxBidonesDisplay">50</span> Bid.
      </div>
      <div>
        <button class="btn-print" onclick="openCardsModal()">📋 Generar Fichas</button>
      </div>
    </div>

    <div id="vehiclesList"></div>

    <button onclick="addVehicle()">+ Añadir Vehículo</button>
  </div>

  <div class="catalog-panel">
    <h2>Catálogo de Referencia</h2>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-veh-basico);"></span> Vehículos Básicos</summary>
      <div id="catalogVehiclesBasic"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-veh-avanzado);"></span> Vehículos Avanzados</summary>
      <div id="catalogVehiclesAdvanced"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-arm-basico);"></span> Armamento Básico</summary>
      <div id="catalogWeaponsBasic"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-arm-avanzado);"></span> Armamento Avanzado</summary>
      <div id="catalogWeaponsAdvanced"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-arm-personal);"></span> Armamento Avanzado (Personales)</summary>
      <div id="catalogWeaponsPersonal"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-arm-descarga);"></span> Armamento Avanzado (Descarga)</summary>
      <div id="catalogWeaponsDropped"></div>
    </details>

    <details>
      <summary><span class="color-tag" style="background: var(--cat-mejora-veh);"></span> Mejoras para Vehículo</summary>
      <div id="catalogVehicleUpgrades"></div>
    </details>
  </div>
</div>

<!-- MODAL PARA VISTA PREVIA E IMPRESIÓN DE FICHAS -->
<div id="cardsModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header-actions">
      <h3 style="margin: 0; color: #fff;">Fichas de Vehículos (63mm x 88mm)</h3>
      <div>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir Fichas</button>
        <button class="btn-danger" onclick="closeCardsModal()">Cerrar</button>
      </div>
    </div>
    <div id="cardsPrintContainer" class="cards-preview-grid"></div>
  </div>
</div>

<script>
  const SPONSORS = {
    "Ninguno": "Ninguna",
    "La Alcaidesa": "Agresivo, Rudo",
    "Beverly, La Diablesa de la Autopista": "Aterrador, Macizo",

  };

  const VEHICLES = [
    { name: "Buggy", category: "Básico", weight: "Ligero", bidones: 6, slots: 2, hull: 6, gear: 6, handling: 4, crew: 2, rules: "Jaula de seguridad" },
    { name: "Camioneta", category: "Básico", weight: "Medio", bidones: 15, slots: 3, hull: 12, gear: 4, handling: 2, crew: 3, rules: "-" },

    { name: "Camión", category: "Básico", weight: "Pesado", bidones: 25, slots: 5, hull: 14, gear: 3, handling: 2, crew: 4, rules: "-" },

    { name: "Moto", category: "Avanzado", weight: "Ligero", bidones: 5, slots: 1, hull: 4, gear: 6, handling: 5, crew: 1, rules: "Pisar a fondo, pivotar" },
    { name: "Moto con sidecar", category: "Avanzado", weight: "Ligero", bidones: 8, slots: 2, hull: 4, gear: 6, handling: 5, crew: 2, rules: "Pisar a fondo, pivotar" },

    { name: "Girocóptero", category: "Avanzado", weight: "Medio", bidones: 10, slots: 0, hull: 4, gear: 6, handling: 4, crew: 1, rules: "As del aire, bombas fuera, volar, restringido" },

    { name: "Helicóptero", category: "Avanzado", weight: "Pesado", bidones: 30, slots: 4, hull: 8, gear: 4, handling: 3, crew: 3, rules: "As del aire, bombas fuera, volar, restringido" },
    { name: "Monster truck", category: "Avanzado", weight: "Pesado", bidones: 25, slots: 2, hull: 10, gear: 4, handling: 3, crew: 2, rules: "Pasar por encima, todoterreno" },
    { name: "Tanque", category: "Avanzado", weight: "Pesado", bidones: 40, slots: 4, hull: 20, gear: 3, handling: 4, crew: 3, rules: "Pasar por encima, pivotar, todoterreno, torreta, restringido" }
  ];

  const WEAPONS = [
    { name: "Ninguna", category: "Básico", range: "-", attack: "-", rules: "-", slots: 0, bidones: 0, sponsor: null },
    
    // BÁSICO
    { name: "Ametralladora", category: "Básico", range: "Doble", attack: "2d6", rules: "-", slots: 1, bidones: 2, sponsor: null },
    { name: "Ametralladora pesada", category: "Básico", range: "Doble", attack: "3d6", rules: "-", slots: 1, bidones: 3, sponsor: null },

  let team = [];

  function is360Native(weapon) {
    if (!weapon || weapon.name === "Ninguna") return false;
    if (weapon.category === "Personal") return true;
    const r = weapon.rules ? weapon.rules.toLowerCase() : "";
    return r.includes("360º") || r.includes("360 grados");
  }

  function addVehicle() {
    const newVehicle = {
      id: Date.now(),
      name: "Nuevo Vehículo",
      type: "",
      weapons: [],
      upgrades: []
    };
    team.push(newVehicle);
    renderBuilder();
  }

  function removeVehicle(id) {
    team = team.filter(v => v.id !== id);
    renderBuilder();
  }

  function updateVehicleType(id, newType) {
    const v = team.find(item => item.id === id);
    if (v) {
      v.type = newType;
      v.weapons = [];
      v.upgrades = [];
      renderBuilder();
    }
  }

  // AL AÑADIR ARMA: Sin selección por defecto (se crea como "Ninguna")
  function addWeaponToVehicle(id) {
    const v = team.find(item => item.id === id);
    if (v) {
      v.weapons.push({ name: "Ninguna", facing: "Frontal" });
      renderBuilder();
    }
  }

  function removeWeaponFromVehicle(id, index) {
    const v = team.find(item => item.id === id);
    if (v && v.weapons[index]) {
      v.weapons.splice(index, 1);
      renderBuilder();
    }
  }

  function updateWeaponName(id, index, weaponName) {
    const v = team.find(item => item.id === id);
    if (v && v.weapons[index]) {
      v.weapons[index].name = weaponName;
      const wData = WEAPONS.find(w => w.name === weaponName);
      if (wData && is360Native(wData)) {
        v.weapons[index].facing = "360º";
      } else if (v.weapons[index].facing === "360º" && (!wData || !is360Native(wData))) {
        v.weapons[index].facing = "Frontal";
      }
      renderBuilder();
    }
  }

  function updateWeaponFacing(id, index, facingValue) {
    const v = team.find(item => item.id === id);
    if (v && v.weapons[index]) {
      v.weapons[index].facing = facingValue;
      renderBuilder();
    }
  }

  // AL AÑADIR MEJORA: Sin selección por defecto (se crea como "Ninguna")
  function addUpgradeToVehicle(id) {
    const v = team.find(item => item.id === id);
    if (v) {
      v.upgrades.push({ name: "Ninguna" });
      renderBuilder();
    }
  }

  function removeUpgradeFromVehicle(id, index) {
    const v = team.find(item => item.id === id);
    if (v && v.upgrades[index]) {
      v.upgrades.splice(index, 1);
      renderBuilder();
    }
  }

  function updateUpgradeName(id, index, upgradeName) {
    const v = team.find(item => item.id === id);
    if (v && v.upgrades[index]) {
      v.upgrades[index].name = upgradeName;
      if (upgradeName === "Ariete" || upgradeName === "Ariete explosivo") {
        v.upgrades[index].facing = "Frontal";
      } else {
        delete v.upgrades[index].facing;
      }
      renderBuilder();
    }
  }

  function updateUpgradeFacing(id, index, facingValue) {
    const v = team.find(item => item.id === id);
    if (v && v.upgrades[index]) {
      v.upgrades[index].facing = facingValue;
      renderBuilder();
    }
  }

  // Filtrado de opciones para select de Armas con opción neutra "Ninguna" y estilizado de opciones deshabilitadas
  function getWeaponsSelectOptionsHTML(selectedName, currentSponsor, isSlotsFull) {
    let html = `<option value="Ninguna" ${selectedName === "Ninguna" ? 'selected' : ''}>-- Seleccionar Arma --</option>`;
    
    const categories = [
      { name: "Básico", label: "Armamento Básico", class: "grp-a-basico" },
      { name: "Avanzado", label: "Armamento Avanzado", class: "grp-a-avanzado" },
      { name: "Personal", label: "Armamento Avanzado (Personales)", class: "grp-a-personal" },
      { name: "Descarga", label: "Armamento Avanzado (Descarga)", class: "grp-a-descarga" }
    ];

    categories.forEach(cat => {
      const items = WEAPONS.filter(w => w.category === cat.name && w.name !== "Ninguna");
      if(items.length > 0) {
        html += `<optgroup label="${cat.label}" class="${cat.class}">`;
        items.forEach(w => {
          const isMishkinRequired = w.sponsor === "Mishkin";
          let isDisabled = isMishkinRequired && currentSponsor !== "Mishkin";
          const isSelected = w.name === selectedName;

          // Si los slots están llenos, deshabilitar solo opciones que consuman 1 o más slots (permitiendo opciones de 0 slots)
          if (isSlotsFull && w.slots > 0 && !isSelected) {
            isDisabled = true;
          }

          let label = `${w.name} (${w.bidones} Bid. | ${w.slots} Slot)`;
          if (isMishkinRequired) label += ` [Mishkin]`;
          if (isDisabled) label += ` (No disponible)`;

          html += `<option value="${w.name}" ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}>${label}</option>`;
        });
        html += `</optgroup>`;
      }
    });
    return html;
  }

  // Filtrado de opciones para select de Mejoras con opción neutra "Ninguna" y estilizado de opciones deshabilitadas
  function getUpgradesSelectOptionsHTML(selectedName, currentSponsor, vehicleData, currentUpgrades, currentIndex, isSlotsFull) {
    let html = `<option value="Ninguna" ${selectedName === "Ninguna" ? 'selected' : ''}>-- Seleccionar Mejora --</option>`;
    
    const items = WEAPONS.filter(w => w.category === "Mejora" && w.name !== "Ninguna");
    html += `<optgroup label="Mejoras para Vehículo" class="grp-m-vehiculo">`;

    const equippedNames = currentUpgrades.map((u, idx) => idx !== currentIndex ? u.name : null).filter(Boolean);
    const crewUpgradeCount = currentUpgrades.filter((u, idx) => idx !== currentIndex && u.name === "Tripulante adicional").length;

    const uniqueUpgrades = [
      "Impulsor de nitrometano",
      "Jaula de seguridad",
      "Motor nuclear experimental",
      "Orugas",
      "Teleportador experimental",
      "Tubo lanzamierdas"
    ];

    items.forEach(w => {
      let isDisabled = false;
      const isSelected = w.name === selectedName;

      if (w.sponsor === "Mishkin" && currentSponsor !== "Mishkin") isDisabled = true;
      if (uniqueUpgrades.includes(w.name) && equippedNames.includes(w.name)) isDisabled = true;
      if (w.name === "Motor nuclear experimental" && vehicleData && vehicleData.weight === "Ligero") isDisabled = true;
      if (w.name === "Orugas" && vehicleData && (vehicleData.name === "Tanque" || vehicleData.name === "Girocóptero" || vehicleData.name === "Helicóptero")) isDisabled = true;
      if (w.name === "Tripulante adicional" && vehicleData && crewUpgradeCount >= vehicleData.crew) isDisabled = true;

      if (isSlotsFull && w.slots > 0 && !isSelected) {
        isDisabled = true;
      }

      let label = `${w.name} (${w.bidones} Bid. | ${w.slots} Slot)`;
      if (w.sponsor) label += ` [${w.sponsor}]`;
      if (isDisabled) label += ` (No disponible)`;

      html += `<option value="${w.name}" ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}>${label}</option>`;
    });

    html += `</optgroup>`;
    return html;
  }

  function renderBuilder() {
    const container = document.getElementById('vehiclesList');
    container.innerHTML = '';
    let grandTotalBidones = 0;
    const maxCans = parseInt(document.getElementById('maxCansSelect').value) || 0;
    const currentSponsor = document.getElementById('sponsorSelect').value;
    const sponsorPerks = SPONSORS[currentSponsor] || "Ninguna";
    const perksElem = document.getElementById('sponsorPerksDisplay');
    if (perksElem) {
      perksElem.innerHTML = `<b>Ventajas:</b> ${sponsorPerks}`;
    }

    document.getElementById('maxBidonesDisplay').innerText = maxCans;

    team.forEach((v) => {
      const vData = VEHICLES.find(item => item.name === v.type);
      
      let vehicleBidones = vData ? vData.bidones : 0;
      let usedSlots = 0;

      if (v.weapons) {
        v.weapons.forEach(w => {
          const wData = WEAPONS.find(item => item.name === w.name);
          if (wData && wData.sponsor === "Mishkin" && currentSponsor !== "Mishkin") {
            w.name = "Ninguna";
          }
        });
      }

      if (v.upgrades && vData) {
        v.upgrades.forEach(u => {
          const uData = WEAPONS.find(item => item.name === u.name);
          if (uData && uData.sponsor === "Mishkin" && currentSponsor !== "Mishkin") u.name = "Ninguna";
          if (u.name === "Motor nuclear experimental" && vData.weight === "Ligero") u.name = "Ninguna";
          if (u.name === "Orugas" && (vData.name === "Tanque" || vData.name === "Girocóptero" || vData.name === "Helicóptero")) u.name = "Ninguna";
        });
      }

      if (v.weapons) {
        v.weapons.forEach(w => {
          const wData = WEAPONS.find(item => item.name === w.name);
          if (wData && wData.name !== "Ninguna") {
            usedSlots += wData.slots;
            let cost = wData.bidones;
            if (w.facing === "360º" && !is360Native(wData)) cost *= 3;
            vehicleBidones += cost;
          }
        });
      }

      let armorCount = 0;
      let extraCrewCount = 0;

      if (v.upgrades) {
        v.upgrades.forEach(u => {
          const uData = WEAPONS.find(item => item.name === u.name);
          if (uData && uData.name !== "Ninguna") {
            usedSlots += uData.slots;
            vehicleBidones += uData.bidones;
            if (u.name === "Blindaje") armorCount++;
            if (u.name === "Tripulante adicional") extraCrewCount++;
          }
        });
      }

      grandTotalBidones += vehicleBidones;

      const card = document.createElement('div');
      card.className = 'vehicle-card';
      if (vData) {
        card.style.borderLeft = `5px solid ${vData.category === 'Básico' ? 'var(--cat-veh-basico)' : 'var(--cat-veh-avanzado)'}`;
      }

      let innerHTML = `
        <div class="vehicle-header">
          <input type="text" value="${v.name}" onchange="updateVehicle(${v.id}, 'name', this.value)" style="font-weight: bold; width: 55%;">
          <div>
            <strong>${vehicleBidones} Bid.</strong> ${vData ? `| <span style="color: ${usedSlots > vData.slots ? '#ff4444' : '#888'}">Slots: ${usedSlots}/${vData.slots}</span>` : ''}
            <button class="btn-danger" style="margin-left: 10px;" onclick="removeVehicle(${v.id})">X</button>
          </div>
        </div>
        <div class="grid">
          <div>
            <label>Tipo de Vehículo:</label>
            <select onchange="updateVehicleType(${v.id}, this.value)">
              <option value="">-- Seleccionar Vehículo --</option>
              <optgroup label="Vehículos Básicos" class="grp-v-basico">
                ${VEHICLES.filter(item => item.category === 'Básico').map(vItem => `<option value="${vItem.name}" ${vItem.name === v.type ? 'selected' : ''}>${vItem.name} (${vItem.bidones} Bid. | ${vItem.slots} Slots)</option>`).join('')}
              </optgroup>
              <optgroup label="Vehículos Avanzados" class="grp-v-avanzado">
                ${VEHICLES.filter(item => item.category === 'Avanzado').map(vItem => `<option value="${vItem.name}" ${vItem.name === v.type ? 'selected' : ''}>${vItem.name} (${vItem.bidones} Bid. | ${vItem.slots} Slots)</option>`).join('')}
              </optgroup>
            </select>
          </div>
        </div>
      `;

      if (!vData) {
        innerHTML += `<div style="color: var(--text-muted); font-style: italic; margin-top: 10px;">Selecciona un tipo de vehículo para comenzar la configuración.</div>`;
      } else {
        const currentHull = vData.hull + (armorCount * 2);
        const currentCrew = vData.crew + extraCrewCount;

        const hullClass = armorCount > 0 ? "stat-modified-hull" : "";
        const crewClass = extraCrewCount > 0 ? "stat-modified-crew" : "";

        innerHTML += `
          <div class="vehicle-stats-box">
            <div class="vehicle-stats-grid">
              <span><b>Peso:</b> ${vData.weight}</span>
              <span class="${hullClass}"><b>Carrocería:</b> ${currentHull} PC ${armorCount > 0 ? `(+${armorCount * 2})` : ''}</span>
              <span><b>Maniobra:</b> ${vData.handling}</span>
              <span><b>Marcha Máx:</b> ${vData.gear}</span>
              <span class="${crewClass}"><b>Tripulación:</b> ${currentCrew} ${extraCrewCount > 0 ? `(+${extraCrewCount})` : ''}</span>
            </div>
            <div style="color: #7dcfb6;"><b>Reglas Especiales:</b> ${vData.rules}</div>
          </div>
        `;

        const isSlotsFull = usedSlots >= vData.slots;

        // SECCIÓN DE ARMAS
        innerHTML += `
          <div class="section-block">
            <div class="section-title">
              <span>Sección de Armas</span>
              <button class="btn-add" onclick="addWeaponToVehicle(${v.id})">+ Añadir Arma</button>
            </div>
            <div class="fixed-weapon-badge">
              <b>Arma Integrada por Defecto:</b> Arma corta (Alcance: Medio | Ataque: 1d6 | Reglas: Personal | Coste: 0 Bid. | Encaramiento: 360º)
            </div>
        `;

        v.weapons.forEach((w, wIdx) => {
          const wData = WEAPONS.find(item => item.name === w.name);
          const isSelected = wData && wData.name !== "Ninguna";
          const native360 = isSelected && is360Native(wData);
          const isPersonal = isSelected && wData.category === "Personal";
          const disableFacing = !isSelected || isPersonal || native360;

          let currentCost = isSelected ? wData.bidones : 0;
          if (isSelected && w.facing === "360º" && !native360) currentCost *= 3;

          innerHTML += `
            <div class="upgrade-row">
              <div class="upgrade-controls">
                <div>
                  <label style="font-size: 0.8em; color: var(--text-muted);">Arma ${wIdx + 1}:</label>
                  <select onchange="updateWeaponName(${v.id}, ${wIdx}, this.value)">
                    ${getWeaponsSelectOptionsHTML(w.name, currentSponsor, isSlotsFull)}
                  </select>
                </div>
                <div>
                  <label style="font-size: 0.8em; color: var(--text-muted);">Encaramiento:</label>
                  <select ${disableFacing ? 'disabled' : ''} onchange="updateWeaponFacing(${v.id}, ${wIdx}, this.value)">
                    <option value="Frontal" ${w.facing === 'Frontal' ? 'selected' : ''}>Frontal</option>
                    <option value="Posterior" ${w.facing === 'Posterior' ? 'selected' : ''}>Posterior</option>
                    <option value="Lateral" ${w.facing === 'Lateral' ? 'selected' : ''}>Lateral</option>
                    <option value="360º" ${w.facing === '360º' ? 'selected' : ''}>360º (Torreta)</option>
                  </select>
                </div>
                <div>
                  <button class="btn-danger" onclick="removeWeaponFromVehicle(${v.id}, ${wIdx})">X</button>
                </div>
              </div>
              ${isSelected ? `
              <div class="weapon-details-badge">
                <span><b>Alcance:</b> ${wData.range}</span>
                <span><b>Ataque:</b> ${wData.attack}</span>
                <span><b>Especial:</b> ${wData.rules}</span>
                <span><b>Coste Total:</b> ${currentCost} Bid.</span>
              </div>` : '<div style="font-size: 0.8em; color: var(--text-muted); font-style: italic;">Selecciona un arma de la lista.</div>'}
            </div>
          `;
        });
        innerHTML += `</div>`;

        // SECCIÓN DE MEJORAS
        innerHTML += `
          <div class="section-block">
            <div class="section-title">
              <span>Sección de Mejoras</span>
              <button class="btn-add" onclick="addUpgradeToVehicle(${v.id})">+ Añadir Mejora</button>
            </div>
        `;

        v.upgrades.forEach((u, uIdx) => {
          const uData = WEAPONS.find(item => item.name === u.name);
          const isSelected = uData && uData.name !== "Ninguna";
          const isRam = isSelected && (u.name === "Ariete" || u.name === "Ariete explosivo");

          innerHTML += `
            <div class="upgrade-row">
              <div class="upgrade-controls">
                <div>
                  <label style="font-size: 0.8em; color: var(--text-muted);">Mejora ${uIdx + 1}:</label>
                  <select onchange="updateUpgradeName(${v.id}, ${uIdx}, this.value)">
                    ${getUpgradesSelectOptionsHTML(u.name, currentSponsor, vData, v.upgrades, uIdx, isSlotsFull)}
                  </select>
                </div>
                <div>
                  <label style="font-size: 0.8em; color: var(--text-muted);">Encaramiento:</label>
                  <select ${!isRam ? 'disabled' : ''} onchange="updateUpgradeFacing(${v.id}, ${uIdx}, this.value)">
                    ${!isRam ? `<option value="N/A" selected>N/A</option>` : `
                      <option value="Frontal" ${u.facing === 'Frontal' ? 'selected' : ''}>Frontal</option>
                      <option value="Posterior" ${u.facing === 'Posterior' ? 'selected' : ''}>Posterior</option>
                      <option value="Lateral" ${u.facing === 'Lateral' ? 'selected' : ''}>Lateral</option>
                    `}
                  </select>
                </div>
                <div>
                  <button class="btn-danger" onclick="removeUpgradeFromVehicle(${v.id}, ${uIdx})">X</button>
                </div>
              </div>
              ${isSelected ? `
              <div class="weapon-details-badge">
                <span><b>Efectos:</b> ${uData.rules}</span>
                <span><b>Coste Total:</b> ${uData.bidones} Bid.</span>
              </div>` : '<div style="font-size: 0.8em; color: var(--text-muted); font-style: italic;">Selecciona una mejora de la lista.</div>'}
            </div>
          `;
        });
        innerHTML += `</div>`;
      }

      card.innerHTML = innerHTML;
      container.appendChild(card);
    });

    const totalElement = document.getElementById('totalBidones');
    totalElement.innerText = grandTotalBidones;
    if (grandTotalBidones > maxCans) {
      totalElement.style.color = '#ff4444';
    } else {
      totalElement.style.color = '#fff';
    }
  }

  function updateVehicle(id, field, value) {
    const v = team.find(item => item.id === id);
    if (v) {
      v[field] = value;
      renderBuilder();
    }
  }

  // LÓGICA DE GENERACIÓN DE FICHAS TIPO CARTA STANDARD (63mm x 88mm)
  function openCardsModal() {
    const modal = document.getElementById('cardsModal');
    const container = document.getElementById('cardsPrintContainer');
    const teamName = document.getElementById('teamName').value || 'Mi Escudería';
    const sponsorName = document.getElementById('sponsorSelect').value;
    const sponsorPerks = SPONSORS[sponsorName] || "Ninguna";

    container.innerHTML = '';

    if (team.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 20px; color:#fff;">No hay vehículos configurados en la escudería.</div>`;
      modal.style.display = 'flex';
      return;
    }

    team.forEach(v => {
      const vData = VEHICLES.find(item => item.name === v.type);
      if (!vData) return;

      let armorCount = 0;
      let extraCrewCount = 0;
      if (v.upgrades) {
        v.upgrades.forEach(u => {
          if (u.name === "Blindaje") armorCount++;
          if (u.name === "Tripulante adicional") extraCrewCount++;
        });
      }

      const totalHull = vData.hull + (armorCount * 2);
      const totalCrew = vData.crew + extraCrewCount;

      let hullBoxesHTML = '';
      for (let i = 0; i < totalHull; i++) {
        hullBoxesHTML += `<span class="card-hull-box"></span>`;
      }

      let weaponsRowsHTML = `
        <tr>
          <td class="left">Arma corta (Pistola)</td>
          <td>Med.</td>
          <td>1d6</td>
          <td>360º</td>
          <td>0</td>
        </tr>
      `;

      if (v.weapons) {
        v.weapons.forEach(w => {
          const wData = WEAPONS.find(item => item.name === w.name);
          if (wData && wData.name !== "Ninguna") {
            let cost = wData.bidones;
            if (w.facing === "360º" && !is360Native(wData)) cost *= 3;
            
            let rShort = wData.range;
            if(rShort === "Doble") rShort = "Dob.";
            else if(rShort === "Medio") rShort = "Med.";
            else if(rShort === "Corto") rShort = "Cor.";
            else if(rShort === "Ráfaga larga") rShort = "Ráf.L";

            weaponsRowsHTML += `
              <tr>
                <td class="left">${wData.name}</td>
                <td>${rShort}</td>
                <td>${wData.attack}</td>
                <td>${w.facing || 'Front.'}</td>
                <td>${cost}B</td>
              </tr>
            `;
          }
        });
      }

      let upgradesRowsHTML = '';
      const activeUpgrades = v.upgrades ? v.upgrades.filter(u => u.name !== "Ninguna") : [];
      if (activeUpgrades.length > 0) {
        activeUpgrades.forEach(u => {
          const uData = WEAPONS.find(item => item.name === u.name);
          if (uData && uData.name !== "Ninguna") {
            upgradesRowsHTML += `
              <tr>
                <td class="left">${uData.name}</td>
                <td>${uData.bidones} Bid.</td>
              </tr>
            `;
          }
        });
      } else {
        upgradesRowsHTML = `<tr><td colspan="2" style="font-style:italic;">Sin mejoras</td></tr>`;
      }

      const cardHTML = `
        <div class="printable-card">
          <div>
            <div class="card-top-bar">
              <span>ESC: ${teamName}</span>
              <span>PAT: ${sponsorName}</span>
            </div>

            <div class="card-title-box">
              <h2>${v.name}</h2>
              <div class="sub">${vData.name} - Peso ${vData.weight}</div>
            </div>

            <div class="card-stats-grid">
              <div class="card-stat-box">
                <div class="lbl">Marcha</div>
                <div class="val">${vData.gear}</div>
              </div>
              <div class="card-stat-box">
                <div class="lbl">Peligro</div>
                <div class="val">[ &nbsp; ]</div>
              </div>
              <div class="card-stat-box">
                <div class="lbl">Maniobra</div>
                <div class="val">${vData.handling}</div>
              </div>
              <div class="card-stat-box">
                <div class="lbl">Trip.</div>
                <div class="val">${totalCrew}</div>
              </div>
            </div>

            <div class="card-hull-section">
              <div class="card-hull-header">
                <span>CARROCERÍA</span>
                <span>${totalHull} PC</span>
              </div>
              <div class="card-hull-boxes">
                ${hullBoxesHTML}
              </div>
            </div>

            <div class="card-section-title">Armas Equipadas</div>
            <table class="mini-table">
              <thead>
                <tr>
                  <th style="text-align:left;">Arma</th>
                  <th>Alc.</th>
                  <th>Atq.</th>
                  <th>Enc.</th>
                  <th>Cost.</th>
                </tr>
              </thead>
              <tbody>
                ${weaponsRowsHTML}
              </tbody>
            </table>

            <div class="card-section-title">Mejoras de Vehículo</div>
            <table class="mini-table">
              <thead>
                <tr>
                  <th style="text-align:left;">Mejora</th>
                  <th>Coste</th>
                </tr>
              </thead>
              <tbody>
                ${upgradesRowsHTML}
              </tbody>
            </table>
          </div>

          <div class="card-section-title">Ventajas de Patrocinador</div>
          <div style="font-size: 5.5pt; text-align: center; border: 0.5px solid #000; padding: 1.5px; margin-bottom: 2px; background: #fafafa;">
            <b>Ventajas:</b> ${sponsorPerks}
          </div>

          <div class="card-footer">
            Nexo Alpha - Gaslands Refuelled
          </div>
        </div>
      `;

      container.innerHTML += cardHTML;
    });

    modal.style.display = 'flex';
  }

  function closeCardsModal() {
    document.getElementById('cardsModal').style.display = 'none';
  }

  renderCatalog();
  addVehicle();
</script>
</body>
</html>

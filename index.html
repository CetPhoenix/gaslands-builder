<!DOCTYPE html>
<html lang="es">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-0555222123747987" crossorigin="anonymous"></script>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gaslands Refuelled - Builder V4.0</title>
  
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff5500'><path d='M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z'/></svg>">

  <!-- Carga de Fuente Uniforme (Roboto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --card-bg: #2a2a2a;
      --accent-color: #ff5500;
      --accent-hover: #e04b00;
      --text-color: #f0f0f0;
      --text-muted: #aaa;
      --text-disabled: #555555;
      --border-color: #333;
      --danger-color: #cc2929;

      /* Colores por Categoría de Vehículos */
      --cat-veh-basico: #2196F3;
      --cat-veh-avanzado: #9C27B0;

      /* Colores por Categoría de Armas/Mejoras */
      --cat-arm-basico: #4CAF50;
      --cat-arm-avanzado: #FF9800;
      --cat-arm-personal: #00BCD4;
      --cat-arm-descarga: #E91E63;
      --cat-mejora-veh: #FFD700;

      /* Colores por Categoría de Ventajas */
      --perk-agresivo: #e53935;
      --perk-aterrador: #8e24aa;
      --perk-intrepido: #fb8c00;
      --perk-macizo: #6d4c41;
      --perk-militar: #43a047;
      --perk-persecucion: #d81b60;
      --perk-preciso: #7cb342;
      --perk-rudo: #1e88e5;
      --perk-tecnologia: #00acc1;
      --perk-temerario: #546e7a;
      --perk-tuneo: #fdd835;
      --perk-velocidad: #3949ab;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 { margin: 0; color: var(--accent-color); font-size: 1.8rem; }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 450px;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .main-layout { grid-template-columns: 1fr; }
    }

    .summary-bar {
      background: var(--panel-bg);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .vehicle-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      position: relative;
    }

    .vehicle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .vehicle-controls-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .slots-progress-container {
      margin-top: 8px;
      margin-bottom: 12px;
      background: #181818;
      border: 1px solid #444;
      border-radius: 4px;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slots-progress-bar-bg {
      flex-grow: 1;
      height: 10px;
      background: #2b2b2b;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #555;
    }

    .slots-progress-bar-fill {
      height: 100%;
      background: #00e676;
      width: 0%;
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    .slots-progress-bar-fill.overlimit {
      background: #cc2929 !important;
    }

    .slots-badge-text {
      font-size: 0.8rem;
      font-weight: bold;
    }

    .vehicle-stats-box {
      background: #242424;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }

    .vehicle-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 6px;
      margin-bottom: 6px;
    }

    .vehicle-stats-grid span {
      background: #1a1a1a;
      padding: 4px 6px;
      border-radius: 3px;
      color: var(--text-muted);
    }

    .stat-modified-green { color: #00e676 !important; font-weight: bold; }

    .section-block {
      background: #181818;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .upgrade-row {
      background: #242424;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .upgrade-controls {
      display: grid;
      grid-template-columns: 1fr 130px 40px;
      gap: 8px;
      align-items: end;
    }

    .perk-controls {
      display: grid;
      grid-template-columns: 1fr 40px;
      gap: 8px;
      align-items: end;
    }

    @media (max-width: 600px) {
      .upgrade-controls, .perk-controls { grid-template-columns: 1fr; }
    }

    .weapon-details-badge {
      background: #1a1a1a;
      border: 1px dashed #444;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 0.8rem;
      color: #7dcfb6;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    select, input, textarea {
      width: 100%;
      padding: 8px;
      background: #2b2b2b;
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
    }

    select:disabled, button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    optgroup.grp-v-basico { color: var(--cat-veh-basico); font-weight: bold; background: #1f2833; }
    optgroup.grp-v-avanzado { color: var(--cat-veh-avanzado); font-weight: bold; background: #2a1b30; }

    option.opt-v-basico { background-color: rgba(33, 150, 243, 0.2) !important; color: #ffffff; }
    option.opt-v-avanzado { background-color: rgba(156, 39, 176, 0.2) !important; color: #ffffff; }

    option.opt-arm-basico { background-color: rgba(76, 175, 80, 0.2) !important; color: #ffffff; }
    option.opt-arm-avanzado { background-color: rgba(255, 152, 0, 0.2) !important; color: #ffffff; }
    option.opt-arm-personal { background-color: rgba(0, 188, 212, 0.2) !important; color: #ffffff; }
    option.opt-arm-descarga { background-color: rgba(233, 30, 99, 0.2) !important; color: #ffffff; }
    option.opt-mejora-veh { background-color: rgba(255, 215, 0, 0.2) !important; color: #ffffff; }

    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover { background: var(--accent-hover); }
    button.btn-danger { background: var(--danger-color); padding: 8px; }
    button.btn-danger:hover { background: #a81e1e; }
    button.btn-add { background: #2e7d32; font-size: 0.85rem; }
    button.btn-add:hover { background: #1b5e20; }
    button.btn-duplicate { background: #00796b; padding: 6px 10px; font-size: 0.8rem; }
    button.btn-duplicate:hover { background: #004d40; }
    button.btn-move { background: #424242; padding: 6px 8px; font-size: 0.8rem; }
    button.btn-move:hover { background: #616161; }
    button.btn-print { background: #008CBA; }
    button.btn-print:hover { background: #007399; }
    button.btn-pdf { background: #d32f2f; }
    button.btn-pdf:hover { background: #b71c1c; }
    button.btn-new-squad { background: #7b1fa2; }
    button.btn-new-squad:hover { background: #6a1b9a; }
    button.btn-save { background: #2e7d32; }
    button.btn-save:hover { background: #1b5e20; }
    button.btn-load { background: #e65100; }
    button.btn-load:hover { background: #bf360c; }
    button.btn-share { background: #0288d1; }
    button.btn-share:hover { background: #0277bd; }

    .actions-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .actions-panel h3 {
      margin-top: 0;
      font-size: 1.1rem;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .actions-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .catalog-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      height: fit-content;
      max-height: 85vh;
      overflow-y: auto;
    }

    .catalog-panel h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    details {
      background: #242424;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 10px;
      padding: 8px 12px;
    }

    summary {
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      text-transform: uppercase;
      outline: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-tag { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

    .catalog-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .placeholder-gallery-container {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px;
    }

    .placeholder-thumb {
      width: 36px; height: 36px; background: #111; border: 1px solid #555;
      border-radius: 4px; cursor: pointer; display: flex; justify-content: center; align-items: center;
    }

    .placeholder-thumb:hover { border-color: var(--accent-color); }

    /* NOTIFICACIONES TOAST */
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      background: #333;
      color: #fff;
      padding: 12px 20px;
      border-radius: 6px;
      border-left: 5px solid var(--accent-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      animation: fadeIn 0.3s ease, fadeOut 0.3s 2.7s ease forwards;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

    /* ESTILOS DEL MODAL Y FICHAS */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 9999;
    }

    .modal-content {
      background: #333; color: #000; width: 95%; max-width: 1200px; max-height: 90vh;
      overflow-y: auto; border-radius: 8px; padding: 20px; box-sizing: border-box;
    }

    .modal-header-actions {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;
      border-bottom: 2px solid #555; padding-bottom: 10px; color: #fff;
    }

    .cards-preview-grid { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }

    .printable-card {
      font-family: 'Roboto', sans-serif !important; background: #fff; color: #000;
      border: 2px solid #000; padding: 2.5mm; box-sizing: border-box; font-size: 6.5pt;
      line-height: 1.1; position: relative; display: flex; flex-direction: column;
      justify-content: space-between; overflow: hidden; border-radius: 3mm;
    }

    .card-size-63x88 { width: 63mm; height: 88mm; }

    .card-top-bar {
      border-bottom: 1px solid #000; padding-bottom: 1px; margin-bottom: 2px;
      font-size: 5.5pt; font-weight: bold; display: flex; justify-content: space-between;
    }

    .card-title-box { text-align: center; border-bottom: 1.5px solid #000; background: #f0f0f0; margin-bottom: 3px; }
    .card-title-box h2 { margin: 0; font-size: 8.5pt; font-weight: 900; }

    .card-stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; margin-bottom: 3px; }
    .card-stat-box { border: 1px solid #000; text-align: center; background: #fafafa; }
    .card-stat-box .lbl { font-size: 4.5pt; font-weight: bold; border-bottom: 0.5px solid #888; }
    .card-stat-box .val { font-size: 7.5pt; font-weight: bold; }

    .card-hull-section { border: 1px solid #000; padding: 2px; margin-bottom: 3px; }
    .card-hull-header { font-size: 5.5pt; font-weight: bold; display: flex; justify-content: space-between; }
    .card-hull-boxes { display: flex; flex-wrap: wrap; gap: 2px; }

    .interactive-counter {
      display: inline-flex; align-items: center; gap: 4px; background: #eee; padding: 2px 4px; border-radius: 3px; border: 1px solid #ccc;
    }

    .counter-btn {
      width: 16px; height: 16px; font-size: 10px; font-weight: bold; cursor: pointer; padding: 0; line-height: 1;
    }

    .mini-table { width: 100%; border-collapse: collapse; margin-bottom: 2px; }
    .mini-table th, .mini-table td { border: 0.5px solid #000; padding: 1px 1.5px; text-align: center; font-size: 5pt; }
    .mini-table th { background: #ddd; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<header>
  <h1>Gaslands Refuelled - Builder V4.0</h1>
  <div>
    <button class="btn-share" onclick="shareSquadronURL()">🔗 Compartir Escudería</button>
  </div>
</header>

<div class="main-layout">
  <div class="builder-column">
    <div class="summary-bar">
      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <button class="btn-new-squad" onclick="createNewSquadron()">✨ Nuevo Escuadrón</button>
        <button class="btn-save" onclick="saveConfiguration()">💾 Guardar (.cet)</button>
        <button class="btn-load" onclick="document.getElementById('fileLoader').click()">📂 Cargar (.cet / .json)</button>
        <input type="file" id="fileLoader" accept=".cet,.json" style="display: none;" onchange="loadConfiguration(event)">
      </div>
      <div>
        <label>Escudería: </label>
        <input type="text" id="teamName" value="Mi Escudería" oninput="renderBuilder()" style="width: 130px;">
      </div>
      <div>
        <label>Patrocinador: </label>
        <select id="sponsorSelect" onchange="renderBuilder()" style="width: 180px;">
          <option value="Ninguno">Sin Patrocinador</option>
          <option value="La Alcaidesa">La Alcaidesa</option>
          <option value="Beverly, La Diablesa de la Autopista">Beverly</option>
          <option value="Los Contrabandistas de Rusty">Rusty</option>
          <option value="Idris">Idris</option>
          <option value="Maxxine">Maxxine</option>
          <option value="Mishkin">Mishkin</option>
          <option value="Miyazaki">Miyazaki</option>
          <option value="La Orden Infernal">La Orden Infernal</option>
          <option value="La Patrulla de la Autopista">La Patrulla</option>
          <option value="Rutherford">Rutherford</option>
          <option value="Scarlett">Scarlett</option>
          <option value="Slime">Slime</option>
          <option value="Verney">Verney</option>
        </select>
      </div>
      <div>
        <label>Formato: </label>
        <input type="number" id="maxCansSelect" value="50" min="1" oninput="renderBuilder()" style="width: 60px;">
      </div>
      <div class="total-display">
        Total: <span id="totalBidones">0</span> / <span id="maxBidonesDisplay">50</span> Bid.
      </div>
      <div>
        <button class="btn-print" onclick="openCardsModal()">📋 Generar Fichas</button>
      </div>
    </div>

    <div id="vehiclesList"></div>

    <button onclick="addVehicle()">+ Añadir Vehículo</button>
  </div>

  <div class="right-column">
    <div class="catalog-panel">
      <h2>Catálogo de Referencia</h2>
      <input type="text" id="catalogSearchInput" placeholder="🔍 Buscar arma, vehículo..." oninput="filterCatalog()" style="margin-bottom:10px;">
      <details id="detBasicVeh">
        <summary><span class="color-tag" style="background: var(--cat-veh-basico);"></span> Vehículos Básicos</summary>
        <div id="catalogVehiclesBasic"></div>
      </details>
      <details id="detAdvVeh">
        <summary><span class="color-tag" style="background: var(--cat-veh-avanzado);"></span> Vehículos Avanzados</summary>
        <div id="catalogVehiclesAdvanced"></div>
      </details>
      <details id="detBasicWeap">
        <summary><span class="color-tag" style="background: var(--cat-arm-basico);"></span> Armamento Básico</summary>
        <div id="catalogWeaponsBasic"></div>
      </details>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<!-- MODAL DE FICHAS -->
<div id="cardsModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header-actions">
      <h3 style="margin: 0; color: #fff;">Opciones de Fichas</h3>
      <div>
        <button class="btn-print" onclick="window.print()">🖨️ Imprimir</button>
        <button class="btn-danger" onclick="closeCardsModal()">Cerrar</button>
      </div>
    </div>
    <div id="cardsPrintContainer" class="cards-preview-grid"></div>
  </div>
</div>

<script>
  // SVG Vectoriales Codificados
  const PLACEHOLDER_SVGS = {
    car: `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#555555"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>`)}`,
    truck: `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#555555"><path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm11.5 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM17 12V9.5h2.5l1.96 2.5H17z"/></svg>`)}`,
    bike: `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#555555"><path d="M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5-3.5zm14-8.5c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5-3.5zm-8.2-12l-1.9 3.2c-.3.4-.2 1 .2 1.3s1 .2 1.3-.2l1.9-3.2 2.7 4.5h-3.5v2h5l-3.3-5.6 2.8-2.8H18v-2h-3.8l-3.4 3.4z"/></svg>`)}`,
    tank: `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#555555"><path d="M20 10h-6.17l2.58-2.58L15 6l-4 4H3c-1.1 0-2 .9-2 2v4c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2v-4c0-1.1-.9-2-2-2zm-1 6H5v-2h14v2z"/></svg>`)}`
  };

  const VEHICLES = [
    { name: "Buggy", category: "Básico", weight: "Ligero", bidones: 6, slots: 2, hull: 6, gear: 6, handling: 4, crew: 2, rules: "Jaula de seguridad" },
    { name: "Camioneta", category: "Básico", weight: "Medio", bidones: 15, slots: 3, hull: 12, gear: 4, handling: 2, crew: 3, rules: "-" },
    { name: "Coche", category: "Básico", weight: "Medio", bidones: 12, slots: 2, hull: 10, gear: 5, handling: 3, crew: 2, rules: "-" },
    { name: "Camión", category: "Básico", weight: "Pesado", bidones: 25, slots: 5, hull: 14, gear: 3, handling: 2, crew: 4, rules: "-" },
    { name: "Moto", category: "Avanzado", weight: "Ligero", bidones: 5, slots: 1, hull: 4, gear: 6, handling: 5, crew: 1, rules: "Pivotar" }
  ];

  const WEAPONS = [
    { name: "Ninguna", category: "Básico", range: "-", attack: "-", rules: "-", slots: 0, bidones: 0 },
    { name: "Ametralladora", category: "Básico", range: "Doble", attack: "2d6", rules: "-", slots: 1, bidones: 2 },
    { name: "Minigun", category: "Básico", range: "Doble", attack: "4d6", rules: "-", slots: 1, bidones: 5 }
  ];

  let team = [];

  function showToast(msg) {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function toggleCollapse(id) {
    const v = team.find(item => item.id === id);
    if (v) {
      v.collapsed = !v.collapsed;
      renderBuilder();
    }
  }

  function shareSquadronURL() {
    const configData = {
      teamName: document.getElementById('teamName').value,
      sponsor: document.getElementById('sponsorSelect').value,
      maxCans: document.getElementById('maxCansSelect').value,
      vehicles: team
    };
    const jsonStr = JSON.stringify(configData);
    const encoded = btoa(encodeURIComponent(jsonStr));
    const url = `${window.location.origin}${window.location.pathname}?squad=${encoded}`;
    
    navigator.clipboard.writeText(url);
    showToast("🔗 ¡Enlace de escudería copiado al portapapeles!");
  }

  function loadFromURL() {
    const params = new URLSearchParams(window.location.search);
    const squadParam = params.get('squad');
    if (squadParam) {
      try {
        const jsonStr = decodeURIComponent(atob(squadParam));
        const data = JSON.parse(jsonStr);
        document.getElementById('teamName').value = data.teamName || "Mi Escudería";
        document.getElementById('sponsorSelect').value = data.sponsor || "Ninguno";
        document.getElementById('maxCansSelect').value = data.maxCans || 50;
        team = data.vehicles || [];
        showToast("¡Escudería cargada desde enlace!");
        return true;
      } catch (e) { console.error("Error al decodificar URL", e); }
    }
    return false;
  }

  function addVehicle() {
    team.push({ id: Date.now(), name: "Nuevo Vehículo", type: "", weapons: [], upgrades: [], perks: [], collapsed: false });
    renderBuilder();
  }

  function selectPlaceholderImage(id, key) {
    const v = team.find(i => i.id === id);
    if (v && PLACEHOLDER_SVGS[key]) {
      v.image = PLACEHOLDER_SVGS[key];
      renderBuilder();
    }
  }

  function renderBuilder() {
    const container = document.getElementById('vehiclesList');
    container.innerHTML = '';
    let grandTotal = 0;

    team.forEach((v, idx) => {
      const vData = VEHICLES.find(i => i.name === v.type);
      let vBidones = vData ? vData.bidones : 0;

      if (v.weapons) {
        v.weapons.forEach(w => {
          const wData = WEAPONS.find(i => i.name === w.name);
          if (wData) vBidones += wData.bidones;
        });
      }

      grandTotal += vBidones;

      const card = document.createElement('div');
      card.className = 'vehicle-card';
      
      card.innerHTML = `
        <div class="vehicle-header">
          <button onclick="toggleCollapse(${v.id})" style="background:none; border:none; color:#fff; font-size:1.1rem; cursor:pointer;">
            ${v.collapsed ? '►' : '▼'}
          </button>
          <input type="text" value="${v.name}" oninput="v.name=this.value;" style="width: 40%; font-weight:bold;">
          <div class="vehicle-controls-btn-group">
            <strong>${vBidones} Bid.</strong>
            <button class="btn-danger" onclick="team.splice(${idx},1); renderBuilder();">X</button>
          </div>
        </div>
        
        ${!v.collapsed ? `
          <div>
            <label>Tipo:</label>
            <select onchange="v.type=this.value; renderBuilder();">
              <option value="">-- Seleccionar --</option>
              ${VEHICLES.map(item => `<option value="${item.name}" ${item.name === v.type ? 'selected' : ''}>${item.name} (${item.bidones} Bid.)</option>`).join('')}
            </select>
          </div>

          ${vData ? `
            <div class="placeholder-gallery-container" style="margin-top:10px;">
              <span style="font-size:0.75rem; color:var(--text-muted);">Siluetas SVG:</span>
              <div class="placeholder-thumb" onclick="selectPlaceholderImage(${v.id}, 'car')"><img src="${PLACEHOLDER_SVGS.car}" style="width:24px;height:24px;"></div>
              <div class="placeholder-thumb" onclick="selectPlaceholderImage(${v.id}, 'truck')"><img src="${PLACEHOLDER_SVGS.truck}" style="width:24px;height:24px;"></div>
              <div class="placeholder-thumb" onclick="selectPlaceholderImage(${v.id}, 'bike')"><img src="${PLACEHOLDER_SVGS.bike}" style="width:24px;height:24px;"></div>
              <div class="placeholder-thumb" onclick="selectPlaceholderImage(${v.id}, 'tank')"><img src="${PLACEHOLDER_SVGS.tank}" style="width:24px;height:24px;"></div>
            </div>
          ` : ''}
        ` : ''}
      `;
      container.appendChild(card);
    });

    document.getElementById('totalBidones').innerText = grandTotal;
  }

  function adjustStat(id, stat, delta) {
    const elem = document.getElementById(`${stat}_val_${id}`);
    if (elem) {
      let current = parseInt(elem.innerText);
      elem.innerText = Math.max(0, current + delta);
    }
  }

  function openCardsModal() {
    const container = document.getElementById('cardsPrintContainer');
    container.innerHTML = '';
    
    team.forEach(v => {
      const vData = VEHICLES.find(i => i.name === v.type);
      if (!vData) return;

      const card = document.createElement('div');
      card.className = 'printable-card card-size-63x88';
      card.innerHTML = `
        <div>
          <div class="card-top-bar">
            <span>ESC: ${document.getElementById('teamName').value}</span>
            <span>${vData.bidones} BID.</span>
          </div>
          <div class="card-title-box">
            <h2>${v.name}</h2>
            <div>${vData.name}</div>
          </div>
          <div class="card-stats-grid">
            <div class="card-stat-box">
              <div class="lbl">Marcha</div>
              <div class="val">
                <span class="interactive-counter">
                  <button class="counter-btn" onclick="adjustStat(${v.id}, 'gear', -1)">-</button>
                  <span id="gear_val_${v.id}">${vData.gear}</span>
                  <button class="counter-btn" onclick="adjustStat(${v.id}, 'gear', 1)">+</button>
                </span>
              </div>
            </div>
            <div class="card-stat-box">
              <div class="lbl">Peligro</div>
              <div class="val">
                <span class="interactive-counter">
                  <button class="counter-btn" onclick="adjustStat(${v.id}, 'hazard', -1)">-</button>
                  <span id="hazard_val_${v.id}">0</span>
                  <button class="counter-btn" onclick="adjustStat(${v.id}, 'hazard', 1)">+</button>
                </span>
              </div>
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);
    });

    document.getElementById('cardsModal').style.display = 'flex';
  }

  function closeCardsModal() { document.getElementById('cardsModal').style.display = 'none'; }

  function filterCatalog() {
    const query = document.getElementById('catalogSearchInput').value.toLowerCase();
    document.querySelectorAll('.catalog-item').forEach(item => {
      item.style.display = item.innerText.toLowerCase().includes(query) ? 'block' : 'none';
    });
  }

  if (!loadFromURL()) {
    addVehicle();
  }
</script>
</body>
</html>

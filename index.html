<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexo Alpha - Gaslands Refuelled</title>
  <style>
    :root {
      --bg-color: #121212;
      --panel-bg: #1e1e1e;
      --card-bg: #2a2a2a;
      --accent-color: #ff5500;
      --accent-hover: #e04b00;
      --text-color: #f0f0f0;
      --text-muted: #aaa;
      --border-color: #333;
      --danger-color: #cc2929;

      /* Colores por Categoría de Vehículos */
      --cat-veh-basico: #2196F3;
      --cat-veh-avanzado: #9C27B0;

      /* Colores por Categoría de Armas/Mejoras */
      --cat-arm-basico: #4CAF50;
      --cat-arm-avanzado: #FF9800;
      --cat-arm-personal: #00BCD4;
      --cat-arm-descarga: #E91E63;
      --cat-mejora-veh: #FFD700;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    header {
      border-bottom: 2px solid var(--accent-color);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; color: var(--accent-color); font-size: 1.8rem; }

    /* Layout principal */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr 450px;
      gap: 20px;
    }

    @media (max-width: 1024px) {
      .main-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Panel del Builder */
    .summary-bar {
      background: var(--panel-bg);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .vehicle-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      position: relative;
    }

    .vehicle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .upgrades-container {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    select, input {
      width: 100%;
      padding: 8px;
      background: #2b2b2b;
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
    }

    select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Estilos de colores en los grupos de select */
    optgroup.grp-v-basico { color: var(--cat-veh-basico); font-weight: bold; }
    optgroup.grp-v-avanzado { color: var(--cat-veh-avanzado); font-weight: bold; }

    optgroup.grp-a-basico { color: var(--cat-arm-basico); font-weight: bold; }
    optgroup.grp-a-avanzado { color: var(--cat-arm-avanzado); font-weight: bold; }
    optgroup.grp-a-personal { color: var(--cat-arm-personal); font-weight: bold; }
    optgroup.grp-a-descarga { color: var(--cat-arm-descarga); font-weight: bold; }
    optgroup.grp-m-vehiculo { color: var(--cat-mejora-veh); font-weight: bold; }
    
    option { color: #ffffff; font-weight: normal; background: #2b2b2b; }

    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover { background: var(--accent-hover); }
    button.btn-danger { background: var(--danger-color); }
    button.btn-danger:hover { background: #a81e1e; }

    /* Panel Lateral: Catálogo */
    .catalog-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      height: fit-content;
      max-height: 85vh;
      overflow-y: auto;
    }

    .catalog-panel h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: var(--accent-color);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    /* Pestañas Plegables Comprimidas con Identificador de Color */
    details {
      background: #242424;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 10px;
      padding: 8px 12px;
    }

    summary {
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      outline: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-tag {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }

    .catalog-item {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      font-size: 0.85rem;
    }

    .catalog-item-header {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      color: #fff;
      margin-bottom: 6px;
    }

    .catalog-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .catalog-stats span {
      background: #1a1a1a;
      padding: 2px 4px;
      border-radius: 3px;
    }

    .catalog-rules {
      color: #7dcfb6;
      font-style: italic;
      font-size: 0.8rem;
    }

    .total-display {
      font-weight: bold;
      font-size: 1.05rem;
    }

    .default-weapon-badge {
      display: inline-block;
      background: #1a3320;
      color: #4CAF50;
      border: 1px solid #4CAF50;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-bottom: 8px;
    }

    .sponsor-badge {
      color: #FF9800;
      font-weight: bold;
      font-size: 0.8rem;
    }
  </style>
</head>

    WEAPONS.filter(w => w.name !== "Ninguna").forEach(w => {
      const item = document.createElement('div');
      item.className = 'catalog-item';
      const sponsorText = w.sponsor ? `<span class="sponsor-badge">[${w.sponsor}]</span>` : '';
      
      if (w.category === "Mejora") {
        item.innerHTML = `
          <div class="catalog-item-header">
            <span>${w.name} ${sponsorText}</span>
            <span style="color: var(--accent-color);">${w.bidones} Bid.</span>
          </div>
          <div class="catalog-stats">
            <span><b>Casillas:</b> ${w.slots}</span>
          </div>
          <div class="catalog-rules"><b>Efectos:</b> ${w.rules}</div>
        `;
        vUpgrades.appendChild(item);
      } else {
        item.innerHTML = `
          <div class="catalog-item-header">
            <span>${w.name} ${sponsorText}</span>
            <span style="color: var(--accent-color);">${w.bidones} Bid.</span>
          </div>
          <div class="catalog-stats">
            <span><b>Alcance:</b> ${w.range}</span>
            <span><b>Ataque:</b> ${w.attack}</span>
            <span><b>Casillas:</b> ${w.slots}</span>
          </div>
          <div class="catalog-rules"><b>Especial:</b> ${w.rules}</div>
        `;
        if (w.category === "Básico") wBasic.appendChild(item);
        else if (w.category === "Avanzado") wAdv.appendChild(item);
        else if (w.category === "Personal") wPersonal.appendChild(item);
        else if (w.category === "Descarga") wDropped.appendChild(item);
      }
    });
  }

  function addVehicle() {
    const newVehicle = {
      id: Date.now(),
      name: "Nuevo Vehículo",
      type: "",
      upgrades: []
    };
    team.push(newVehicle);
    renderBuilder();
  }

  function removeVehicle(id) {
    team = team.filter(v => v.id !== id);
    renderBuilder();
  }

  function updateVehicleType(id, newType) {
    const v = team.find(item => item.id === id);
    if (v) {
      v.type = newType;
      v.upgrades = [];
      renderBuilder();
    }
  }

  function updateVehicleUpgrade(id, index, upgradeName) {
    const v = team.find(item => item.id === id);
    if (v) {
      v.upgrades[index] = upgradeName;
      renderBuilder();
    }
  }

  // Genera opciones agrupadas filtrando por Patrocinador (Mishkin)
  function getWeaponSelectOptionsHTML(selectedWeaponName, currentSponsor) {
    let html = `<option value="Ninguna" ${selectedWeaponName === 'Ninguna' ? 'selected' : ''}>-- Ninguna --</option>`;
    
    const categories = [
      { name: "Básico", label: "Armamento Básico", class: "grp-a-basico" },
      { name: "Avanzado", label: "Armamento Avanzado", class: "grp-a-avanzado" },
      { name: "Personal", label: "Armamento Avanzado (Personales)", class: "grp-a-personal" },
      { name: "Descarga", label: "Armamento Avanzado (Descarga)", class: "grp-a-descarga" },
      { name: "Mejora", label: "Mejoras para Vehículo", class: "grp-m-vehiculo" }
    ];

    categories.forEach(cat => {
      const items = WEAPONS.filter(w => w.category === cat.name && w.name !== "Ninguna");
      if(items.length > 0) {
        html += `<optgroup label="${cat.label}" class="${cat.class}">`;
        items.forEach(w => {
          // Si requiere Mishkin y el patrocinador actual no es Mishkin, se deshabilita
          const isMishkinRequired = w.sponsor === "Mishkin";
          const isDisabled = isMishkinRequired && currentSponsor !== "Mishkin";
          const isSelected = w.name === selectedWeaponName;
          
          let displayLabel = `${w.name} (${w.bidones} Bid. | ${w.slots} Slot)`;
          if (isMishkinRequired) displayLabel += ` [Mishkin]`;

          html += `<option value="${w.name}" ${isSelected ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}>${displayLabel}</option>`;
        });
        html += `</optgroup>`;
      }
    });

    return html;
  }

  function renderBuilder() {
    const container = document.getElementById('vehiclesList');
    container.innerHTML = '';
    let grandTotalBidones = 0;
    const maxCans = parseInt(document.getElementById('maxCansSelect').value);
    const currentSponsor = document.getElementById('sponsorSelect').value;

    document.getElementById('maxBidonesDisplay').innerText = maxCans;

    team.forEach((v) => {
      const vData = VEHICLES.find(item => item.name === v.type);
      
      let vehicleBidones = vData ? vData.bidones : 0;
      let usedSlots = 0;

      // Resetear items de Mishkin si cambió el patrocinador
      if (v.upgrades) {
        v.upgrades = v.upgrades.map(uName => {
          const uData = WEAPONS.find(w => w.name === uName);
          if (uData && uData.sponsor === "Mishkin" && currentSponsor !== "Mishkin") {
            return "Ninguna";
          }
          return uName;
        });

        v.upgrades.forEach(uName => {
          const wData = WEAPONS.find(w => w.name === uName);
          if (wData) {
            usedSlots += wData.slots;
            vehicleBidones += wData.bidones;
          }
        });
      }

      grandTotalBidones += vehicleBidones;

      const card = document.createElement('div');
      card.className = 'vehicle-card';
      
      if (vData) {
        card.style.borderLeft = `5px solid ${vData.category === 'Básico' ? 'var(--cat-veh-basico)' : 'var(--cat-veh-avanzado)'}`;
      }

      let upgradesHTML = '';

      if (!vData) {
        upgradesHTML = `<div style="color: var(--text-muted); font-style: italic; margin-top: 10px;">Selecciona un tipo de vehículo para comenzar la configuración.</div>`;
      } else {
        upgradesHTML += `<div class="default-weapon-badge"><b>Arma Integrada por Defecto:</b> Arma corta (1d6 | Alcance Medio | 0 Bid. | 0 Slots)</div>`;
        upgradesHTML += `<div class="upgrades-container">`;

        const maxUpgradeFields = Math.max(vData.slots, 2); 
        
        for (let i = 0; i < maxUpgradeFields; i++) {
          const currentUpgradeName = v.upgrades[i] || "Ninguna";
          const currentWData = WEAPONS.find(w => w.name === currentUpgradeName);
          
          const isSlotsFull = usedSlots >= vData.slots;
          const isThisEmpty = !currentWData || currentWData.slots === 0;
          const shouldBlock = isSlotsFull && isThisEmpty;

          upgradesHTML += `
            <div>
              <label style="font-size: 0.85em; color: var(--text-muted);">Arma / Mejora ${i + 1}:</label>
              <select ${shouldBlock ? 'disabled' : ''} onchange="updateVehicleUpgrade(${v.id}, ${i}, this.value)">
                ${getWeaponSelectOptionsHTML(currentUpgradeName, currentSponsor)}
              </select>
            </div>
          `;
        }
        upgradesHTML += `</div>`;
      }

      card.innerHTML = `
        <div class="vehicle-header">
          <input type="text" value="${v.name}" onchange="updateVehicle(${v.id}, 'name', this.value)" style="font-weight: bold; width: 55%;">
          <div>
            <strong>${vehicleBidones} Bid.</strong> ${vData ? `| <span style="color: ${usedSlots > vData.slots ? '#ff4444' : '#888'}">Slots: ${usedSlots}/${vData.slots}</span>` : ''}
            <button class="btn-danger" style="margin-left: 10px;" onclick="removeVehicle(${v.id})">X</button>
          </div>
        </div>
        <div class="grid">
          <div>
            <label>Tipo de Vehículo:</label>
            <select onchange="updateVehicleType(${v.id}, this.value)">
              <option value="">-- Seleccionar Vehículo --</option>
              <optgroup label="Vehículos Básicos" class="grp-v-basico">
                ${VEHICLES.filter(item => item.category === 'Básico').map(vItem => `<option value="${vItem.name}" ${vItem.name === v.type ? 'selected' : ''}>${vItem.name} (${vItem.bidones} Bid.)</option>`).join('')}
              </optgroup>
              <optgroup label="Vehículos Avanzados" class="grp-v-avanzado">
                ${VEHICLES.filter(item => item.category === 'Avanzado').map(vItem => `<option value="${vItem.name}" ${vItem.name === v.type ? 'selected' : ''}>${vItem.name} (${vItem.bidones} Bid.)</option>`).join('')}
              </optgroup>
            </select>
          </div>
        </div>
        ${upgradesHTML}
        ${vData ? `
        <div style="margin-top: 10px; font-size: 0.85em; color: var(--text-muted);">
          <b>Categoría:</b> ${vData.category} | <b>Peso:</b> ${vData.weight} | <b>PC:</b> ${vData.hull} | <b>Marcha Máx:</b> ${vData.gear} | <b>Maniobra:</b> ${vData.handling} | <b>Tripulación:</b> ${vData.crew}
        </div>` : ''}
      `;
      container.appendChild(card);
    });

    const totalElement = document.getElementById('totalBidones');
    totalElement.innerText = grandTotalBidones;
    if (grandTotalBidones > maxCans) {
      totalElement.style.color = '#ff4444';
    } else {
      totalElement.style.color = '#fff';
    }
  }

  // Inicialización
  renderCatalog();
  addVehicle();
</script>
</body>
</html>
